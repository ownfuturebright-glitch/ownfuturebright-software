<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5f9;color:#1d2433;display:flex;min-height:100vh}

.gb{margin:2px 0 8px 22px;border-left:1px solid #34436e;padding-left:6px}
.gb a{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#cfd6e6;cursor:pointer;font-size:13px;font-weight:600;border-radius:6px}

.sub{margin-left:14px;border-left:1px solid #34436e;padding-left:4px}

.ctl{display:flex;gap:10px;padding:12px;flex-wrap:wrap;align-items:end}

.tc .ic{background:#eef1ff;border-radius:10px;padding:9px;font-size:18px}

.top select{border:0;font-weight:700;font-size:15px;padding:0;width:auto;background:transparent;cursor:pointer}
.badge{background:#e3f7ec;color:#14803c;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;margin-left:auto}
.av{background:#111a33;color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

.kp i{font-style:normal;font-size:11px;color:#6b7690}
.dash2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.dash2{grid-template-columns:1fr}}
.pan{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px #0001}
.pan>small{display:block;font-size:11px;color:#6b7690;margin:2px 0 8px}
.chart{display:flex;align-items:flex-end;gap:12px;height:230px;border-bottom:1px solid #e6e9f2;padding-top:10px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;color:#8a94a8}
.bar2{width:70%;max-width:34px;background:linear-gradient(#5b7cff,#3d5afe);border-radius:6px 6px 0 0;margin-bottom:4px}
.bar2.z{background:#e3e7f0}
.fys{text-align:right;font-size:12px;color:#6b7690;margin-top:10px}
.fys b{color:#1d2433;font-size:14px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qt{display:flex;align-items:center;gap:8px;border:1px solid #e1e5f0;border-radius:10px;padding:16px 12px;font-size:13px;font-weight:600;cursor:pointer}
.qt:hover{border-color:#3d5afe;background:#f5f7ff}
.qt b{margin-left:auto;color:#3d5afe;font-size:18px}
.gate{background:#fff;border-radius:14px;padding:56px 20px;box-shadow:0 1px 4px #0001}
.gbox{max-width:420px;margin:0 auto;text-align:center}
.gico{width:68px;height:68px;border-radius:18px;background:#e8edff;color:#3d5afe;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.gbox h2{margin:0 0 8px;font-size:21px;font-weight:600}
.gbox p{margin:0 0 24px;font-size:13px;color:#4a63b8}
.gbox label{text-align:left;font-weight:700;font-size:12px;color:#1d2433;margin:0 0 6px}
.gbox input{padding:14px;border:2px solid #c5cbd8;border-radius:10px;font-size:18px;text-align:center;letter-spacing:6px;margin-bottom:12px;background:#fff}
.gbox input:focus{outline:0;border-color:#3d5afe;box-shadow:0 0 0 3px #3d5afe22}
.gbtn{width:100%;padding:14px;border-radius:10px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.gbtn:disabled{background:#9fb0f5;cursor:not-allowed}
.gerr{color:#e53935;font-size:13px;margin-top:12px}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.ic2{background:#fff;border:1px solid #e1e5f0;border-radius:14px;padding:18px}
.ic2 .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:15px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{background:#f5f6fa;border-radius:10px;padding:12px 14px;margin-top:14px}
.pv small{display:block;font-size:11px;font-weight:700;color:#6b7690;margin-bottom:6px}
.pv b{font-size:15px}
.isave{display:flex;align-items:center;gap:8px;padding:11px 18px;font-weight:600}
.sc{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;margin-bottom:16px;overflow:hidden}
.sc .sh{padding:16px 20px;border-bottom:1px solid #eceff5;font-weight:700;font-size:14px}
.sc .sb{padding:16px 20px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.g4 label,.sc label{font-size:11px;font-weight:700;color:#475069;margin:0 0 5px}
.ro{background:#f3f5f9;color:#475069}
.hd2{display:flex;align-items:center;gap:14px;padding:18px 20px}
.hico{width:46px;height:46px;border-radius:12px;background:#e8edff;display:flex;align-items:center;justify-content:center;font-size:20px}
.bdg.w{background:#fff0d9;color:#b26a00}
.it{width:100%;border-collapse:collapse;font-size:13px;min-width:1040px}
.it th{background:#f6f7fb;font-size:11px;color:#6b7690;padding:10px 8px;text-align:left}
.it td{padding:8px;border-top:1px solid #eef0f5;white-space:nowrap}
.it input,.it select{padding:7px 8px;font-size:13px}
.sbot{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.sbot{grid-template-columns:1fr}}
.tp>div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #e1e5f0;font-size:13px}
.tp .gt{background:#111a33;color:#fff;border:0;border-radius:10px;padding:16px;margin-top:12px;font-size:14px;align-items:center}
.tp .gt b{font-size:20px}
.ol{background:#fff;color:#111a33;border:1.5px solid #111a33;padding:10px 18px;font-weight:600}
.lnk{color:#3d5afe;cursor:pointer;font-size:12px;font-weight:600}
.toast{position:fixed;right:22px;bottom:22px;background:#111a33;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 4px 18px #0004}
.bk3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.bcard{background:#fff;border:1px solid #e1e5f0;border-radius:16px;padding:26px;display:flex;flex-direction:column;min-height:340px}
.bico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.bcard h3{margin:0 0 10px;font-size:17px}
.bcard p{margin:0;font-size:14px;color:#5b6784;line-height:1.7}
.bfoot{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-top:16px}
.bfoot button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;white-space:nowrap}
.bst{border-radius:10px;padding:12px 14px;font-size:13px;font-weight:600;margin:16px 0 8px}
.bst.ok{background:#e8f7ee;color:#14803c}.bst.no{background:#f1f3f8;color:#6b7690}.bst.wn{background:#fff4de;color:#b26a00}
button:disabled{opacity:.5;cursor:not-allowed}
.bnote{font-size:12px;color:#6b7690;margin-top:4px}
.kp{cursor:pointer;transition:box-shadow .15s,transform .15s}
.kp:hover{box-shadow:0 4px 14px #0002;transform:translateY(-1px)}
main{flex:1;padding:20px;overflow:auto;min-width:0}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar h1{margin:0;font-size:22px;flex:1}
input,select,textarea{padding:8px 10px;border:1px solid #c5cbd8;border-radius:6px;font-size:14px;width:100%;font-family:inherit}
.bar input{width:200px}
button{padding:8px 14px;border:0;border-radius:6px;cursor:pointer;font-size:14px;background:#3d5afe;color:#fff}
button.e{background:#f0a500;padding:5px 10px}
button.d{background:#e53935;padding:5px 10px}
button.g{background:#8a94a8}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px #0002;overflow:auto;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#e8ecf7;text-align:left;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid #eceff5}
.empty{padding:24px;text-align:center;color:#8a94a8}
dialog{border:0;border-radius:10px;padding:20px;width:min(460px,94vw);box-shadow:0 8px 30px #0005}
dialog::backdrop{background:#0006}
label{display:block;font-size:13px;margin:10px 0 3px;color:#475069}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.tot{padding:10px;text-align:right;font-weight:600}
.neg{color:#e53935}
h3{margin:4px 0 8px}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="top" id="top"></div>
  <div class="bar"><h1 id="ttl"></h1><input id="q" placeholder="Search..."><button id="add">+ Create New</button></div>
  <div id="extra"></div>
  <div class="card" id="list"></div>
</main>
<dialog id="dlg"><h3 id="dt"></h3><div id="frm"></div><div class="btns"><button class="g" id="cx">Cancel</button><button id="sv">Save</button></div></dialog>

<script>
const UNITS=["Nos","Pcs","Kg","Gm","Ltr","Box","Mtr","Dozen"];
const today=()=>new Date().toISOString().slice(0,10);
const tx=(t)=>({title:t,tx:1,f:[
 {k:"date",l:"Date",t:"date",r:1},{k:"inv",l:"Invoice / Bill No"},{k:"party",l:"Party",src:"party",r:1},{k:"item",l:"Item",src:"item",r:1},
 {k:"qty",l:"Qty",t:"number",r:1},{k:"rate",l:"Rate",t:"number",r:1},{k:"remark",l:"Remark"}]});
const M={
 company:{title:"Company Master",f:[{k:"name",l:"Company Name",r:1},{k:"gstin",l:"GSTIN"},{k:"phone",l:"Phone"},{k:"city",l:"City"},{k:"address",l:"Address",t:"textarea"},{k:"pin",l:"Pin Code"},{k:"stcode",l:"State Code (e.g. 07)"}]},
 party:{title:"Party Master",f:[{k:"name",l:"Party Name",r:1},{k:"type",l:"Type",opts:["Customer","Supplier","Both"]},{k:"phone",l:"Phone"},{k:"city",l:"City"},{k:"gstin",l:"GSTIN"},{k:"addr",l:"Address"},{k:"pin",l:"Pin Code"},{k:"stcode",l:"State Code (e.g. 07)"},{k:"opening",l:"Opening Balance (Dr +ve / Cr -ve)",t:"number"}]},
 item:{title:"Item Master",f:[{k:"name",l:"Item Name",r:1},{k:"code",l:"Item Code"},{k:"unit",l:"Unit",opts:UNITS},{k:"srate",l:"Sale Rate",t:"number"},{k:"prate",l:"Purchase Rate",t:"number"},{k:"openq",l:"Opening Stock Qty",t:"number"},{k:"minq",l:"Low Stock Limit (Qty, blank = 10)",t:"number"},{k:"roq",l:"Reorder Qty (Auto PO)",t:"number"},{k:"supp",l:"Default Supplier (Auto PO)",src:"party"},{k:"hsn",l:"HSN Code"},{k:"gst",l:"GST %",t:"number"}]},
 stock:{title:"Stocks (Adjustment)",f:[{k:"date",l:"Date",t:"date",r:1},{k:"item",l:"Item",src:"item",r:1},{k:"type",l:"Type",opts:["In","Out"],r:1},{k:"qty",l:"Qty",t:"number",r:1},{k:"remark",l:"Remark"}]},
 sale:tx("Sale Entry"), purchase:tx("Purchase Entry"), salereturn:tx("Sale Return"), purchasereturn:tx("Purchase Return"),
 po:{title:"Purchase Order",tx:1,f:[{k:"date",l:"Date",t:"date",r:1},{k:"party",l:"Supplier",src:"party",r:1},{k:"item",l:"Item",src:"item",r:1},{k:"qty",l:"Qty",t:"number",r:1},{k:"rate",l:"Rate",t:"number",r:1},{k:"status",l:"Status",opts:["Pending","Received","Cancelled"]},{k:"remark",l:"Remark"}]},
 receipt:{title:"Receipt Voucher",f:[{k:"date",l:"Date",t:"date",r:1},{k:"party",l:"Party",src:"party",r:1},{k:"amount",l:"Amount",t:"number",r:1},{k:"mode",l:"Mode",opts:["Cash","Bank","UPI","Cheque"]},{k:"remark",l:"Remark"}]},
 payment:{title:"Payment Voucher",f:[{k:"date",l:"Date",t:"date",r:1},{k:"party",l:"Party",src:"party",r:1},{k:"amount",l:"Amount",t:"number",r:1},{k:"mode",l:"Mode",opts:["Cash","Bank","UPI","Cheque"]},{k:"remark",l:"Remark"}]},
 journal:{title:"Journal Voucher",f:[{k:"date",l:"Date",t:"date",r:1},{k:"dr",l:"Debit Account (Party)",src:"party",r:1},{k:"cr",l:"Credit Account (Party)",src:"party",r:1},{k:"amount",l:"Amount",t:"number",r:1},{k:"remark",l:"Narration"}]}
};
const GROUPS=[["Master","📦",["party","item"]],["Company","🏢",["company"]],["Transactions","🗎",["sale","purchase","salereturn","purchasereturn","receipt","payment","journal","po","autopo"]],["Utility","🛠️",["gstlogin","gstr1","payremind","einvsand","einvlive","ewbsand","ewblive"]],["Display","📖",["accbook","daybook","outstanding","finalres","ledger","stockstatus"]],["Other","🗃️",["invset","apiset","urlset","backup"]]];
const CH={accbook:["cashbook","bankbook","journalbook","saleregister","purchaseregister","receiptregister","paymentregister","salereturnregister","purchasereturnregister"],outstanding:["recv","pay"],finalres:["trading","finpos"]};
const PT={accbook:"Accounts Book",outstanding:"Outstanding Analysis",finalres:"Final Result"};
const ICON={company:"🏢",party:"👥",item:"📦",stock:"📊",sale:"🧾",purchase:"🛒",salereturn:"🧾",purchasereturn:"🛒",receipt:"✉️",payment:"✉️",journal:"⚖️",accbook:"📘",daybook:"📅",outstanding:"₹",finalres:"⚖️",ledger:"📖",stockstatus:"🧮",po:"📝",autopo:"⚙️",gstlogin:"➜",gstr1:"🧾",payremind:"₹",einvsand:"📄",einvlive:"📄",ewbsand:"🚚",ewblive:"🚚",backup:"💾",invset:"🔢",apiset:"🔑",urlset:"🔗"};
const OPEN={Master:false,Company:false,Transactions:false,Utility:false,Display:false,Other:false};
const T=k=>M[k]?M[k].title:(R[k]?R[k].t:PT[k]);

let DB={};
try{DB=JSON.parse(localStorage.getItem("acc_db")||"{}")}catch(e){DB={}}
Object.keys(M).forEach(k=>DB[k]=DB[k]||[]);
const save=()=>{try{localStorage.setItem("acc_db",JSON.stringify(DB))}catch(e){}bkAuto()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lookup=(src,id)=>{if(!id)return "";const r=DB[src].find(x=>x.id===id);return r?r.name:"(deleted)"};
const val=(f,v)=>f.src?lookup(f.src,v):(v??"");


/* ===== Display / Reports ===== */
const n2=v=>(+v||0).toFixed(2);
const dc=v=>n2(Math.abs(v))+(v>=0?" Dr":" Cr");
const _d=new Date(),FY0=_d.getMonth()>=3?_d.getFullYear():_d.getFullYear()-1;
const RS={date:today(),party:"",from:"",to:"",fy:FY0,company:"",bookFY:FY0,bookPeriod:"Monthly",bookMonth:String(new Date().getMonth()+1)};
const fyl=y=>y+"-"+String(y+1).slice(2);
const inr=v=>"₹"+Math.round(+v||0).toLocaleString("en-IN");
const TG=["saleregister","purchaseregister","receiptregister","recv","pay"];
function dashGo(i){
 const k=TG[i];
 if(k!=="recv"&&k!=="pay"){RS.from=RS.fy+"-04-01";RS.to=(RS.fy+1)+"-03-31"}
 RS.back=null;cur=k;render();
}
function ledgerOf(id){RS.party=id;RS.from="";RS.to="";cur="ledger";render()}
const act=(k,id)=>`<button class="e" style="padding:3px 9px" onclick="regEdit('${k}','${id}')">Edit</button> <button class="d" style="padding:3px 9px" onclick="regDel('${k}','${id}')">Delete</button>`;
function regEdit(k,id){if(KC[k])regOpen(k,id);else recOpen(k,id)}
function regDel(k,id){if(!confirm("Are you sure you want to delete this entry?"))return;DB[k]=DB[k].filter(x=>x.id!==id);save();render()}
function regOpen(k,id){RS.back=KC[cur]?null:cur;cur=k;RS.sf=null;openSale(id)}
function recOpen(k,id){RS.ret=cur;RS.newParty=null;RS.newItem=null;cur=k;render();openForm(id)}
function go(k){cur=k;RS.sf=null;RS.back=null;render();openForm()}
function renderTop(){
 const cs=DB.company,c=cs.find(x=>x.id===RS.company)||cs[0];
 let fy="";for(let y=FY0-3;y<=FY0+1;y++)fy+=`<option value="${y}" ${y===RS.fy?"selected":""}>${fyl(y)}</option>`;
 $("top").innerHTML=`<div class="tc"><span class="ic">🏢</span><div><small>CURRENT COMPANY</small><select onchange="RS.company=this.value;render()">${cs.length?cs.map(x=>`<option value="${x.id}" ${c&&x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join(""):"<option>Create a company</option>"}</select></div></div><div class="tc"><span class="ic">📅</span><div><small>FINANCIAL YEAR</small><select onchange="RS.fy=+this.value;render()">${fy}</select></div></div><span class="badge">✔ Saved in Browser</span><span class="av">${esc((c?c.name:"A").slice(0,2).toUpperCase())}</span>`;
}
const sum=k=>DB[k].reduce((a,x)=>a+sv(x),0);
const stockQty=i=>{let q=+i.openq||0;const s=k=>DB[k].reduce((a,x)=>a+lines(x).filter(l=>l.item===i.id).reduce((b,l)=>b+(+l.qty||0),0),0);
 q+=s("purchase")+s("salereturn")-s("sale")-s("purchasereturn");
 DB.stock.filter(x=>x.item===i.id).forEach(x=>q+=(x.type==="In"?1:-1)*(+x.qty||0));return q};
const LED={sale:"dr",salereturn:"cr",purchase:"cr",purchasereturn:"dr",payment:"dr",receipt:"cr"};
function entries(pid){const e=[];
 for(const k in LED)DB[k].filter(x=>x.party===pid).forEach(x=>e.push({k,id:x.id,date:x.date,type:M[k].title,remark:x.remark||"",dr:LED[k]==="dr"?+x.amount||0:0,cr:LED[k]==="cr"?+x.amount||0:0}));
 DB.journal.forEach(x=>{if(x.dr===pid)e.push({k:"journal",id:x.id,date:x.date,type:"Journal Voucher",remark:x.remark||"",dr:+x.amount||0,cr:0});if(x.cr===pid)e.push({k:"journal",id:x.id,date:x.date,type:"Journal Voucher",remark:x.remark||"",dr:0,cr:+x.amount||0})});
 return e.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
const bal=p=>(+p.opening||0)+entries(p.id).reduce((a,x)=>a+x.dr-x.cr,0);
const tbl=(h,rows,foot)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.length?rows.map(r=>"<tr>"+r.map(c=>`<td>${c}</td>`).join("")+"</tr>").join(""):`<tr><td colspan="${h.length}" class="empty">No data found</td></tr>`}</table>`+(foot?`<div class="tot">${foot}</div>`:"");
const dateCtl=(k,l)=>`<div><label>${l}</label><input type="date" value="${RS[k]}" onchange="RS.${k}=this.value;render()"></div>`;
const isBank=x=>(x.mode||"Cash")!=="Cash";

function bookPeriodRange(){
 const fy=+(RS.bookFY??RS.fy),m=+(RS.bookMonth||4),type=RS.bookPeriod||"Monthly";
 let startMonth=m, startYear=fy+(m<=3?1:0), endMonth=m, endYear=startYear;
 if(type==="Quarterly"){startMonth=4+Math.floor(((m>=4?m-4:m+8))/3)*3;startYear=fy+(startMonth>12?1:0);startMonth=((startMonth-1)%12)+1;endMonth=((startMonth+2-1)%12)+1;endYear=startYear+(endMonth<startMonth?1:0)}
 else if(type==="Half Yearly"){const idx=m>=4?m-4:m+8;startMonth=idx<6?4:10;startYear=fy+(startMonth===10?0:0);endMonth=startMonth===4?9:3;endYear=startMonth===4?fy:fy+1}

 apoRows().forEach(r=>{const a=A[r.i.id]||{},on=a.on??true,qty=+(a.qty??r.sug),party=a.party??r.i.supp??"";
  if(!on||!(qty>0))return;

}

function bkpLoad(f){

  if(!d||!Object.keys(M).some(k=>Array.isArray(d[k]))){alert("The format of this file does not match this app. Use 'Create structure file' below to export the structure of the file.");return}
  if(!confirm("This will replace the current data with the backup data. Are you sure you want to restore?"))return;
  Object.keys(M).forEach(k=>DB[k]=Array.isArray(d[k])?d[k]:[]);
  if(d.settings)DB.settings={...d.settings,api:(DB.settings||{}).api};
  save();alert("Restore completed");cur="dashboard";render();
 };
 rd.readAsText(f);
}
function bkpSchema(f){
 if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{let j;try{j=JSON.parse(rd.result)}catch(x){alert("This file is not valid JSON");return}
  const st=j.storage||j,out={};
  Object.keys(st).forEach(k=>{
   if(/key|token|password|secret/i.test(k)){out[k]="(hidden)";return}
   let v=st[k];
   if(typeof v==="string"){try{v=JSON.parse(v)}catch(x){out[k]="text, length "+String(st[k]).length;return}}
   if(Array.isArray(v)){
    const o={count:v.length},f0=v[0];
    if(f0&&typeof f0==="object"){o.fields=Object.keys(f0);o.nested={};Object.keys(f0).forEach(q=>{const w=f0[q];if(Array.isArray(w)&&w[0]&&typeof w[0]==="object")o.nested[q]=Object.keys(w[0])})}
    else o.type=typeof f0;
    out[k]=/history/i.test(k)?{count:v.length}:o;
   }else if(v&&typeof v==="object")out[k]={keys:Object.keys(v).slice(0,60)};
   else out[k]=typeof v;
  });
  dl("backup_structure.json",JSON.stringify(out,null,2),"application/json");
 };
 rd.readAsText(f);
}

async function gdApi(url,o){
 o=o||{};const r=await fetch(url,{...o,headers:{Authorization:"Bearer "+GD.tok,...(o.headers||{})}});
 if(r.status===401){GD.state="expired";throw new Error("expired")}

async function gdConnect(){
 if(!GD.cid){alert("Enter your Google Client ID first");return}
 try{await gdLoad()}catch(e){alert(e.message);return}
 GD.tc=google.accounts.oauth2.initTokenClient({client_id:GD.cid,scope:"https://www.googleapis.com/auth/drive.file",
  callback:async r=>{
   if(r.error){GD.state=GD.tok?"expired":"error";GD.err=r.error_description||r.error;if(cur==="backup")render();return}
   GD.tok=r.access_token;GD.exp=Date.now()+((+r.expires_in||3600)-120)*1000;GD.state="ready";GD.err="";GD.warned=0;
   try{const a=await gdApi("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)");GD.mail=a.user.emailAddress}catch(e){}
   await gdBackup();if(cur==="backup")render()},
  error_callback:e=>{GD.state=GD.tok?"expired":"none";GD.err=(e&&e.type)||"Sign-in was cancelled";if(cur==="backup")render()}});
 GD.tc.requestAccessToken({prompt:""});

async function gdFolder(){

 if(!id){const c=await gdApi("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"Accounts Backup",mimeType:"application/vnd.google-apps.folder"})});id=c.id}

 const l=await gdApi("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id)");
 let id=l.files&&l.files[0]&&l.files[0].id;
 if(id)await gdApi(up+id+"?uploadType=media",hd);

  const c=await gdApi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp});id=c.id}

}

function sfCompute(){

 const pre=f.items.map(l=>{const gross=(+l.qty||0)*(+l.rate||0),d=gross*(+l.disc||0)/100;return {d,t0:gross-d}});
 const sub=pre.reduce((a,o)=>a+o.t0,0),dv=Math.max(+f.dval||0,0);
 const cap=base=>base>0?(f.dtype==="amt"?Math.min(dv,base):base*Math.min(dv,100)/100):0;
 const idPre=post?0:cap(sub);
 let tv=0,dc=0,cg=0,sg=0,ig=0;
 const L=f.items.map((l,i)=>{const o0=pre[i],share=sub>0?idPre*o0.t0/sub:0,t=o0.t0-share,tx=t*(+l.gst||0)/100;
  const o={t,d:o0.d+share,cg:intra?tx/2:0,sg:intra?tx/2:0,ig:intra?0:tx,tot:t+tx};tv+=t;dc+=o.d;cg+=o.cg;sg+=o.sg;ig+=o.ig;return o});

 const gross=tv+cg+sg+ig,idPost=post?rd2(cap(gross)):0,tot=gross-idPost,grand=Math.round(tot);
 return {L,sub,idisc:post?idPost:idPre,idPost,post,tv,dc:dc+idPost,cg,sg,ig,gross,tot,round:grand-tot,grand,intra};
}

 const R0=v=>"₹"+n2(v);
 $("list").innerHTML=`<div class="sc"><div class="hd2"><div class="hico">🧾</div><div style="flex:1"><b style="font-size:17px">${K.head}</b><div style="font-size:11px;color:#6b7690;margin-top:2px">${esc(c.name||"No company selected")} • GSTIN: ${esc(c.gstin||"-")}</div></div><span class="bdg ${m.intra?"a":"w"}">${m.intra?"INTRA-STATE":"INTER-STATE"}</span></div>
 <div class="sb g4" style="border-top:1px solid #eceff5"><div><label>${K.no} *</label><input value="${esc(f.no)}" oninput="sfSet('no',this.value)"></div><div><label>Date *</label><input type="date" value="${esc(f.date)}" onchange="sfSet('date',this.value)"></div><div><label>Full Number Preview</label><input class="ro" id="sf_full" readonly value="${esc(sfFull())}"></div><div><label>${K.type}</label><input class="ro" readonly value="${m.intra?K.local:K.inter}"></div></div></div>
 <div class="sc"><div class="sh">Party Details</div><div class="sb g4"><div><div style="display:flex;justify-content:space-between;align-items:baseline"><label>${K.pl} *</label><a class="lnk" onclick="sfNewParty()">+ Add New ${K.pl.replace(" Name","")}</a></div><select onchange="sfParty(this.value)"><option value="">Select ${K.pl.replace(" Name","").toLowerCase()}</option>${DB.party.filter(K.f).map(p=>`<option value="${p.id}" ${p.id===f.party?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div><label>GSTIN</label><input value="${esc(f.gstin)}" oninput="sfSet('gstin',this.value.toUpperCase())"></div><div><label>${K.pos}</label><select onchange="sfSet('pos',this.value);render()">${f.pos&&!stName(f.pos)?`<option value="${esc(f.pos)}" selected>${esc(f.pos)}</option>`:""}${STATES.map(z=>`<option value="${z[0]}" ${z[0]===f.pos?"selected":""}>${z[1]}</option>`).join("")}</select></div><div><label>Tax Type</label><input class="ro" readonly value="${m.intra?"CGST + SGST":"IGST"}"></div></div></div>
 <div class="sc"><div class="sh" style="display:flex;justify-content:space-between;align-items:center"><span>Item Details</span><a class="lnk" onclick="sfNewItem()">+ Add New Item</a></div><div style="overflow-x:auto"><table class="it"><tr><th>#</th><th>ITEM</th><th>HSN</th><th>UNIT</th><th>QTY</th><th>RATE</th><th>DISC %</th><th>TAXABLE</th><th>GST %</th>${m.intra?"<th>CGST</th><th>SGST</th>":"<th>IGST</th>"}<th>TOTAL</th><th></th></tr>${f.items.map((l,i)=>sfRowHtml(l,i,m)).join("")}</table></div><div class="sb"><a class="lnk" onclick="sfAdd()">+ Add another item</a></div></div>
 <datalist id="dl_items">${DB.item.map(i=>`<option value="${esc(i.name)}"></option>`).join("")}</datalist>
 <div class="sbot"><div class="sc" style="margin:0"><div class="sb"><label>Narration / Remarks</label><textarea rows="4" placeholder="Optional invoice narration..." oninput="sfSet('remark',this.value)">${esc(f.remark)}</textarea><div class="btns" style="justify-content:flex-start;margin-top:22px"><button class="ol" onclick="sfClear()">Clear</button><button class="ol" onclick="salePrintForm()">🖨 Print / Export</button><button class="isave" onclick="saleSave()">${SAVEICO} Save Invoice (F2)</button></div></div></div>
 <div class="sc" style="margin:0"><div class="sb tp"><div><span>Sub Total</span><b id="t_sub">${R0(m.sub)}</b></div><div><span>Taxable Value</span><b id="t_tv">${R0(m.tv)}</b></div><div><span>Total Discount</span><b id="t_dc">${R0(m.dc)}</b></div>${m.intra?`<div><span>CGST</span><b id="t_cg">${R0(m.cg)}</b></div><div><span>SGST</span><b id="t_sg">${R0(m.sg)}</b></div>`:`<div><span>IGST</span><b id="t_ig">${R0(m.ig)}</b></div>`}<div><span>Round Off</span><b id="t_rd">${m.round>=0?"+":"−"}${R0(Math.abs(m.round))}</b></div><div><span>Invoice Discount</span><span style="display:flex;gap:6px;align-items:center"><select style="width:58px;padding:5px" onchange="sfSet('dtype',this.value);sfUpd()"><option value="pct" ${f.dtype!=="amt"?"selected":""}>%</option><option value="amt" ${f.dtype==="amt"?"selected":""}>₹</option></select><input type="number" min="0" step="any" style="width:84px;padding:5px 8px" value="${esc(f.dval)}" oninput="sfSet('dval',this.value);sfUpd()">${m.post?"":`<b id="t_id" style="min-width:76px;text-align:right">−${R0(m.idisc)}</b>`}</span></div>${m.post?`<div><span>Less: Invoice Discount</span><b id="t_pd">−${R0(m.idPost)}</b></div>`:""}<div class="gt"><span>Grand Total</span><b id="t_gt">${R0(m.grand)}</b></div></div></div></div>`;
}
["sale","purchase","salereturn","purchasereturn"].forEach(k=>{R[k+"register"].f=function(){
 const l=DB[k].filter(x=>(!RS.from||x.date>=RS.from)&&(!RS.to||x.date<=RS.to)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
 const ctl=`<div class="ctl">${dateCtl("from","From")}${dateCtl("to","To")}</div>`;
 let tv=0,tx=0,tt=0;
 const rows=l.map((x,i)=>{const g=gstCalc(x),t=x.taxable!==undefined?+x.amount:g.tot;tv+=g.tv;tx+=g.tax;tt+=t;
  return [i+1,x.date,`<a class="lnk" style="font-size:13px" onclick="regOpen('${k}','${x.id}')" title="Open this entry">${esc(x.inv||docNo(k,x))}</a>`,esc(lookup("party",x.party)),esc(lineSum(x)),n2(g.tv),n2(g.tax),n2(t),esc(x.remark||""),act(k,x.id)]});
 return ctl+tbl(["#","Date",KC[k].no.replace(".",""),KC[k].pl.replace(" Name",""),"Items","Taxable","GST","Total","Narration","Action"],rows,`Entries: ${l.length} &nbsp; Taxable: ₹ ${n2(tv)} &nbsp; GST: ₹ ${n2(tx)} &nbsp; Total: ₹ ${n2(tt)}`)}});

let cur="dashboard",editId=null;
const $=id=>document.getElementById(id);

function buildNav(){
 const it=k=>CH[k]?`<a data-p="${k}"><span>${ICON[k]}</span>${T(k)}<span class="ar2">${OPEN[k]?"⌃":"⌄"}</span></a><div class="sub ${OPEN[k]?"":"shut"}">${CH[k].map(c=>`<a data-k="${c}" class="${c===cur?"on":""}">${T(c)}</a>`).join("")}</div>`:`<a data-k="${k}" class="${k===cur?"on":""}"><span>${ICON[k]}</span>${T(k)}</a>`;
 $("nav").innerHTML="<h2>📒 Accounts</h2>"+`<a class="top1 ${cur==="dashboard"?"on":""}" data-k="dashboard"><span>▦</span>Dashboard</a>`+GROUPS.map(([g,ic,ks])=>`<div class="grp ${OPEN[g]?"":"shut"}"><div class="gh" data-g="${g}"><span>${ic}</span>${g}<span class="ar">⌃</span></div><div class="gb">`+ks.map(it).join("")+"</div></div>").join("");
 $("nav").querySelectorAll(".gh").forEach(h=>h.onclick=()=>{OPEN[h.dataset.g]=!OPEN[h.dataset.g];buildNav()});
 $("nav").querySelectorAll("a[data-p]").forEach(a=>a.onclick=()=>{OPEN[a.dataset.p]=!OPEN[a.dataset.p];buildNav()});
 $("nav").querySelectorAll("a[data-k]").forEach(a=>a.onclick=()=>{RS.back=null;if(KC[a.dataset.k])RS.sf=null;cur=a.dataset.k;$("q").value="";render()});
}

function stockSummary(){
 const rows=DB.item.map(i=>{
  let q=+i.openq||0;
  const s=(k)=>DB[k].filter(x=>x.item===i.id).reduce((a,x)=>a+(+x.qty||0),0);
  q+=s("purchase")+s("salereturn")-s("sale")-s("purchasereturn");
  DB.stock.filter(x=>x.item===i.id).forEach(x=>q+=(x.type==="In"?1:-1)*(+x.qty||0));
  return `<tr><td>${esc(i.name)}</td><td>${esc(i.unit||"")}</td><td class="${q<0?"neg":""}"><b>${q}</b></td></tr>`;
 }).join("");
 return `<div class="card"><table><tr><th colspan="3">Current Stock (Opening + Purchase + Sale Return − Sale − Purchase Return ± Adjustment)</th></tr><tr><th>Item</th><th>Unit</th><th>Stock</th></tr>${rows||'<tr><td colspan="3" class="empty">Create an item in Item Master first</td></tr>'}</table></div>`;
}

function render(){
 if(RS.lastCur!==cur){RS.lastCur=cur;GROUPS.forEach(([g,,ks])=>{if(ks.includes(cur))OPEN[g]=true});Object.keys(CH).forEach(q=>{if(CH[q].includes(cur)){OPEN[q]=true;GROUPS.forEach(([g,,ks])=>{if(ks.includes(q))OPEN[g]=true})}})}
 buildNav();renderTop();
 const isR=!!R[cur],dash=cur==="dashboard";
 $("add").style.display=(!isR||dash)?"":"none";$("q").style.display=isR?"none":"";
 $("add").textContent=dash?"+ Create Company":"+ Create New";
 $("list").className=(dash||cur==="urlset"||cur==="invset"||cur==="backup")?"":"card";
 const gated=cur==="apiset"||cur==="urlset";
 if(!gated)RS.gateOk="";
 if(isR){$("ttl").textContent=R[cur].t;$("extra").innerHTML="";
  if(gated&&RS.gateOk!==cur){$("list").className="";$("list").innerHTML=gateHtml();setTimeout(()=>{const e=$("gpw");if(e&&e.focus)e.focus()},50)}
  else $("list").innerHTML=R[cur].f();
  return}
 if(KC[cur]){renderSale();return}
 const m=M[cur];
 $("ttl").textContent=m.title;
 $("extra").innerHTML=cur==="stock"?stockSummary():"";
 const q=$("q").value.toLowerCase();
 const cols=m.f.slice();
 if(m.tx)cols.push({k:"amount",l:"Amount"});
 let data=DB[cur].filter(r=>!q||cols.some(f=>String(val(f,r[f.k])).toLowerCase().includes(q)));
 if(!data.length){$("list").innerHTML='<div class="empty">No records found</div>';return}
 let html="<table><tr><th>#</th>"+cols.map(f=>`<th>${f.l}</th>`).join("")+"<th>Action</th></tr>";
 data.forEach((r,i)=>{
  html+=`<tr><td>${i+1}</td>`+cols.map(f=>`<td>${esc(val(f,r[f.k]))}</td>`).join("")+
  `<td><button class="e" onclick="openForm('${r.id}')">Edit</button> <button class="d" onclick="del('${r.id}')">Delete</button></td></tr>`;
 });
 html+="</table>";
 if(m.tx||cur==="receipt"||cur==="payment"||cur==="journal"){
  const t=data.reduce((a,r)=>a+(+r.amount||0),0);
  html+=`<div class="tot">Total: ₹ ${t.toFixed(2)}</div>`;
 }
 $("list").innerHTML=html;
}

function openForm(id){
 if(KC[cur]){openSale(id);return}
 editId=id||null;
 const m=M[cur],rec=id?DB[cur].find(x=>x.id===id):{};
 $("dt").textContent=(id?"Edit ":"New ")+m.title;
 $("frm").innerHTML=m.f.map(f=>{
  const v=rec[f.k]??(f.t==="date"?today():"");
  let inp;
  if(f.src){
   inp=`<select id="f_${f.k}"><option value="">-- Select --</option>`+DB[f.src].map(o=>`<option value="${o.id}" ${o.id===v?"selected":""}>${esc(o.name)}</option>`).join("")+"</select>";
  }else if(f.opts){
   inp=`<select id="f_${f.k}">`+f.opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")+"</select>";
  }else if(f.t==="textarea"){inp=`<textarea id="f_${f.k}" rows="2">${esc(v)}</textarea>`}
  else inp=`<input id="f_${f.k}" type="${f.t||"text"}" ${f.t==="number"?'step="any"':""} value="${esc(v)}">`;
  return `<label>${f.l}${f.r?" *":""}</label>${inp}`;
 }).join("")+(m.tx?'<div class="tot" id="amt"></div>':"");
 if(m.tx){
  const calc=()=>{$("amt").textContent="Amount: ₹ "+((+$("f_qty").value||0)*(+$("f_rate").value||0)).toFixed(2)};
  $("f_qty").oninput=$("f_rate").oninput=calc;
  $("f_item").onchange=()=>{
   const it=DB.item.find(x=>x.id===$("f_item").value);
   if(it&&!$("f_rate").value)$("f_rate").value=(cur==="sale"||cur==="purchasereturn")?(it.srate||""):(it.prate||"");
   if(cur==="sale"||cur==="salereturn"){if(it)$("f_rate").value=it.srate||""}
   if(cur==="purchase"||cur==="purchasereturn"){if(it)$("f_rate").value=it.prate||""}
   calc();
  };
  calc();
 }
 if(!id&&M[cur].f.some(f=>f.k==="inv")&&invAuto(cur))$("f_inv").value=invNext(cur);
 $("dlg").showModal();
}

function saveForm(){
 const m=M[cur],rec={};
 for(const f of m.f){
  const v=$("f_"+f.k).value.trim();
  if(f.r&&!v){alert(f.l+" is required");return}
  rec[f.k]=v;
 }
 if(cur==="journal"&&rec.dr===rec.cr){alert("Debit and Credit accounts must be different");return}
 if(m.tx)rec.amount=((+rec.qty||0)*(+rec.rate||0)).toFixed(2);
 if(editId){const i=DB[cur].findIndex(x=>x.id===editId);DB[cur][i]={...DB[cur][i],...rec}}
 else{const nid=uid();DB[cur].push({id:nid,...rec});if(RS.ret){if(cur==="party")RS.newParty=nid;if(cur==="item")RS.newItem=nid}}
 save();$("dlg").close();render();
}

function del(id){
 if(!confirm("Are you sure you want to delete this record?"))return;
 if(cur==="party"||cur==="item"){
  const used=Object.keys(M).some(k=>k!==cur&&DB[k].some(r=>r.party===id||r.item===id||r.dr===id||r.cr===id||(r.items||[]).some(l=>l.item===id)));
  if(used&&!confirm("This record is used in other entries. Delete it anyway?"))return;
 }
 DB[cur]=DB[cur].filter(x=>x.id!==id);
 save();render();
}

$("add").onclick=()=>{if(KC[cur]&&RS.sf){RS.sf=null;if(RS.back){cur=RS.back;RS.back=null}render();return}if(cur==="dashboard"){cur="company";render()}openForm()};
document.addEventListener("keydown",e=>{if(e.key==="F2"&&KC[cur]&&RS.sf){e.preventDefault();saleSave()}});
$("sv").onclick=saveForm;
$("cx").onclick=()=>$("dlg").close();
$("dlg").addEventListener("close",()=>{if(RS.ret){const k=RS.ret,np=RS.newParty,ni=RS.newItem;RS.ret=null;RS.newParty=null;RS.newItem=null;cur=k;render();if(np&&RS.sf)sfParty(np);if(ni&&RS.sf)sfItemNew(ni)}});
$("q").oninput=render;
render();
bkInit();
</script>
</body>
</html>
