<body>
<nav id="nav"></nav>
<main>
  <div class="top" id="top"></div>

  <div id="extra"></div>

</main>
<dialog id="pdlg" style="width:min(520px,94vw)"></dialog><dialog id="dlg"><h3 id="dt"></h3><div id="frm"></div><div class="btns"><button class="g" id="cx">Cancel</button><button id="sv">Save</button></div></dialog>

<script>
const UNITS=["Nos","Pcs","Kg","Gm","Ltr","Box","Mtr","Dozen"];
const today=()=>new Date().toISOString().slice(0,10);
const tx=(t)=>({title:t,tx:1,f:[
 {k:"date",l:"Date",t:"date",r:1},{k:"inv",l:"Invoice / Bill No"},{k:"party",l:"Party",src:"party",r:1},{k:"item",l:"Item",src:"item",r:1},
 {k:"qty",l:"Qty",t:"number",r:1},{k:"rate",l:"Rate",t:"number",r:1},{k:"remark",l:"Remark"}]});
const M={
 company:{title:"Company Master",f:[{k:"name",l:"Company Name",r:1},{k:"gstin",l:"GSTIN"},{k:"phone",l:"Phone"},{k:"city",l:"City"},{k:"address",l:"Address",t:"textarea"},{k:"pin",l:"Pin Code"},{k:"stcode",l:"State Code (e.g. 07)"}]},
 party:{title:"Party Master",f:[{k:"name",l:"Party Name",r:1},{k:"type",l:"Type",opts:["Customer","Supplier","Both"]},{k:"cash",l:"Cash Party (not shown in Outstanding)",opts:["No","Yes"]},{k:"phone",l:"Phone"},{k:"vehicle",l:"Vehicle Number"},{k:"city",l:"City"},{k:"gstin",l:"GSTIN"},{k:"addr",l:"Address"},{k:"pin",l:"Pin Code"},{k:"stcode",l:"State Code (e.g. 07)"},{k:"opening",l:"Opening Balance (Dr +ve / Cr -ve)",t:"number"}]},
 item:{title:"Item Master",f:[{k:"name",l:"Item Name",r:1},{k:"code",l:"Item Code"},{k:"unit",l:"Unit",opts:UNITS},{k:"srate",l:"Sale Rate",t:"number"},{k:"prate",l:"Purchase Rate",t:"number"},{k:"openq",l:"Opening Stock Qty",t:"number"},{k:"minq",l:"Low Stock Limit (Qty, blank = 10)",t:"number"},{k:"roq",l:"Reorder Qty (Auto PO)",t:"number"},{k:"supp",l:"Default Supplier (Auto PO)",src:"party"},{k:"hsn",l:"HSN Code"},{k:"gst",l:"GST %",t:"number"}]},
 stock:{title:"Stocks (Adjustment)",f:[{k:"date",l:"Date",t:"date",r:1},{k:"item",l:"Item",src:"item",r:1},{k:"type",l:"Type",opts:["In","Out"],r:1},{k:"qty",l:"Qty",t:"number",r:1},{k:"remark",l:"Remark"}]},
 sale:tx("Sale Entry"), purchase:tx("Purchase Entry"), salereturn:tx("Sale Return"), purchasereturn:tx("Purchase Return"),
 po:{title:"Purchase Order",tx:1,f:[{k:"date",l:"Date",t:"date",r:1},{k:"party",l:"Supplier",src:"party",r:1},{k:"item",l:"Item",src:"item",r:1},{k:"qty",l:"Qty",t:"number",r:1},{k:"rate",l:"Rate",t:"number",r:1},{k:"status",l:"Status",opts:["Pending","Received","Cancelled"]},{k:"remark",l:"Remark"}]},
 receipt:{title:"Receipt Voucher",f:[{k:"number",l:"Voucher No."},{k:"date",l:"Date",t:"date",r:1},{k:"party",l:"Received From Party",src:"party",r:1},{k:"account",l:"Received In",opts:["Cash Account","Bank Account"]},{k:"amount",l:"Received Amount (₹)",t:"number",r:1},{k:"tds",l:"TDS Deducted (₹)",t:"number"},{k:"remark",l:"Narration / Remarks",t:"textarea"}]},
 payment:{title:"Payment Voucher",f:[{k:"number",l:"Voucher No."},{k:"date",l:"Date",t:"date",r:1},{k:"party",l:"Paid To Party",src:"party",r:1},{k:"account",l:"Paid From",opts:["Cash Account","Bank Account"]},{k:"amount",l:"Payment Amount (₹)",t:"number",r:1},{k:"tds",l:"TDS Deducted (₹)",t:"number"},{k:"remark",l:"Narration / Remarks",t:"textarea"}]},
 journal:{title:"Journal Voucher",f:[{k:"date",l:"Date",t:"date",r:1},{k:"dr",l:"Debit Account (Party)",src:"party",r:1},{k:"cr",l:"Credit Account (Party)",src:"party",r:1},{k:"amount",l:"Amount",t:"number",r:1},{k:"remark",l:"Narration"}]}
};
const GROUPS=[["Master","📦",["party","item"]],["Company","🏢",["company"]],["Transactions","🗎",["sale","purchase","salereturn","purchasereturn","receipt","payment","journal","po","autopo"]],["Utility","🛠️",["gstlogin","gstr1","gstreminder","payremind","einvsand","einvlive","ewbsand","ewblive"]],["Display","📖",["accbook","daybook","outstanding","finalres","ledger","itemledger","stockstatus"]],["Other","🗃️",["invset","apiset","urlset","backup"]]];
const CH={accbook:["cashbook","bankbook","journalbook","saleregister","purchaseregister","receiptregister","paymentregister","salereturnregister","purchasereturnregister"],outstanding:["recv","pay"],finalres:["trading","finpos"]};
const PT={accbook:"Accounts Book",outstanding:"Outstanding Analysis",finalres:"Final Result"};
const ICON={company:"🏢",party:"👥",item:"📦",stock:"📊",sale:"🧾",purchase:"🛒",salereturn:"🧾",purchasereturn:"🛒",receipt:"✉️",payment:"✉️",journal:"⚖️",accbook:"📘",daybook:"📅",outstanding:"₹",finalres:"⚖️",ledger:"📖",itemledger:"📦",stockstatus:"🧮",po:"📝",autopo:"⚙️",gstlogin:"➜",gstr1:"🧾",gstreminder:"🔔",payremind:"₹",einvsand:"📄",einvlive:"📄",ewbsand:"🚚",ewblive:"🚚",backup:"💾",invset:"🔢",apiset:"🔑",urlset:"🔗"};
const OPEN={Master:false,Company:false,Transactions:false,Utility:false,Display:false,Other:false};
const T=k=>M[k]?M[k].title:(R[k]?R[k].t:PT[k]);

let DB={};
try{DB=JSON.parse(localStorage.getItem("acc_db")||"{}")}catch(e){DB={}}
Object.keys(M).forEach(k=>DB[k]=DB[k]||[]);
const save=()=>{try{localStorage.setItem("acc_db",JSON.stringify(DB))}catch(e){}bkAuto()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lookup=(src,id)=>{if(!id)return "";const r=DB[src].find(x=>x.id===id);return r?r.name:"(deleted)"};
const val=(f,v)=>f.src?lookup(f.src,v):(v??"");


/* ===== Display / Reports ===== */
const n2=v=>(+v||0).toFixed(2);
const dc=v=>n2(Math.abs(v))+(v>=0?" Dr":" Cr");
const _d=new Date(),FY0=_d.getMonth()>=3?_d.getFullYear():_d.getFullYear()-1;
const RS={date:today(),party:"",from:"",to:"",fy:FY0,company:"",bookFY:FY0,bookPeriod:"Month",bookMonth:String(new Date().getMonth()+1),periodType:"Month",periodMonth:String(new Date().getMonth()+1),periodFY:FY0,periodFrom:FY0+"-04-01",periodTo:(FY0+1)+"-03-31"};
const fyl=y=>y+"-"+String(y+1).slice(2);
const inr=v=>"₹"+Math.round(+v||0).toLocaleString("en-IN");
const TG=["saleregister","purchaseregister","receiptregister","recv","pay"];
function dashGo(i){
 const k=TG[i];
 if(k!=="recv"&&k!=="pay"){RS.from=RS.fy+"-04-01";RS.to=(RS.fy+1)+"-03-31"}
 RS.back=null;cur=k;render();
}
function itemOf(id){RS.item=id;RS.back=null;cur="itemledger";render()}
function ledgerOf(id){RS.party=id;RS.from="";RS.to="";cur="ledger";render()}
function liveIrnLocked(k,id){const x=(DB[k]||[]).find(z=>z.id===id);return k==="sale"&&!!(x&&x.irn&&x.irnEnvironment!=="sand")}
const act=(k,id)=>liveIrnLocked(k,id)?`<button class="e" style="padding:3px 9px" onclick="regEdit('${k}','${id}')" title="Open invoice for review; saving is disabled">Edit</button> <button disabled title="Live E-Invoice generated: deletion is locked" style="padding:3px 9px;opacity:.45;cursor:not-allowed">Delete 🔒</button>`:`<button class="e" style="padding:3px 9px" onclick="regEdit('${k}','${id}')">Edit</button> <button class="d" style="padding:3px 9px" onclick="regDel('${k}','${id}')">Delete</button>`;
function regEdit(k,id){if(KC[k])regOpen(k,id);else recOpen(k,id)}
function regDel(k,id){if(liveIrnLocked(k,id)){alert("Live E-Invoice generated. Delete is disabled for this invoice.");return}if(!confirm("Are you sure you want to delete this entry?"))return;DB[k]=DB[k].filter(x=>x.id!==id);save();render()}
function regOpen(k,id){RS.back=KC[cur]?null:cur;cur=k;RS.sf=null;openSale(id)}
function recOpen(k,id){RS.ret=cur;RS.newParty=null;RS.newItem=null;cur=k;render();openForm(id)}
function go(k){cur=k;RS.sf=null;RS.back=null;render();openForm()}
function renderTop(){
 const cs=DB.company,c=cs.find(x=>x.id===RS.company)||cs[0];
 let fy="";for(let y=FY0-3;y<=FY0+1;y++)fy+=`<option value="${y}" ${y===RS.fy?"selected":""}>${fyl(y)}</option>`;
 $("top").innerHTML=`<div class="tc"><span class="ic">🏢</span><div><small>CURRENT COMPANY</small><select onchange="coPick(this.value)">${cs.length?cs.map(x=>`<option value="${x.id}" ${c&&x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join(""):"<option>Create a company</option>"}</select></div></div><div class="tc"><span class="ic">📅</span><div><small>FINANCIAL YEAR</small><select onchange="RS.fy=+this.value;render()">${fy}</select></div></div><span class="badge">✔ Saved in Browser</span><span class="av">${esc((c?c.name:"A").slice(0,2).toUpperCase())}</span>`;
}

function sfCompute(){

 const pre=f.items.map(l=>{const gross=(+l.qty||0)*(+l.rate||0),d=gross*(+l.disc||0)/100;return {d,t0:gross-d}});
 const sub=pre.reduce((a,o)=>a+o.t0,0),dv=Math.max(+f.dval||0,0);
 const cap=base=>base>0?(f.dtype==="amt"?Math.min(dv,base):base*Math.min(dv,100)/100):0;
 const idPre=post?0:cap(sub);
 let tv=0,dc=0,cg=0,sg=0,ig=0;
 const L=f.items.map((l,i)=>{const o0=pre[i],share=sub>0?idPre*o0.t0/sub:0,t=o0.t0-share,tx=t*(+l.gst||0)/100;
  const o={t,d:o0.d+share,cg:intra?tx/2:0,sg:intra?tx/2:0,ig:intra?0:tx,tot:t+tx};tv+=t;dc+=o.d;cg+=o.cg;sg+=o.sg;ig+=o.ig;return o});
 const rd2=v=>Math.round(v*100)/100;tv=rd2(tv);if(intra){const tx=rd2(cg+sg);cg=rd2(tx/2);sg=rd2(tx-cg)}else ig=rd2(ig);
 const gross=tv+cg+sg+ig,idPost=post?rd2(cap(gross)):0,tot=gross-idPost,grand=Math.round(tot);
 return {L,sub,idisc:post?idPost:idPre,idPost,post,tv,dc:dc+idPost,cg,sg,ig,gross,tot,round:grand-tot,grand,intra};
}

 m.L.forEach((o,i)=>{S("c_t"+i,R0(o.t));S("c_c"+i,R0(o.cg));S("c_s"+i,R0(o.sg));S("c_g"+i,R0(o.ig));S("c_o"+i,R0(o.tot))});
 S("t_sub",R0(m.sub));S("t_id","−"+R0(m.idisc));S("t_pd","−"+R0(m.idPost));S("t_tv",R0(m.tv));S("t_dc",R0(m.dc));S("t_cg",R0(m.cg));S("t_sg",R0(m.sg));S("t_ig",R0(m.ig));
 S("t_rd",(m.round>=0?"+":"−")+R0(Math.abs(m.round)));S("t_gt",R0(m.grand));
}

 l.name=name;

function sfItemNew(id){

function sfBuild(){

 f.items.forEach((l,i)=>{if(!l.item&&!l.name&&!(+l.qty))return;const o=m.L[i];
  items.push({item:l.item,hsn:l.hsn,unit:l.unit,qty:+l.qty||0,rate:+l.rate||0,disc:+l.disc||0,gst:+l.gst||0,taxable:r2(o.t),cg:r2(o.cg),sg:r2(o.sg),ig:r2(o.ig),total:r2(o.tot)})});
 return {id:f.id,inv:sfFull().trim(),invNo:f.no,date:f.date,party:f.party,gstin:f.gstin,pos:f.pos,remark:f.remark,items,discType:f.dtype,discVal:+f.dval||0,discMode:f.dmode==="pre"?"pre":"post",invDisc:r2(m.idisc),postDisc:r2(m.idPost),subtotal:r2(m.sub),taxable:r2(m.tv),discount:r2(m.dc),cgst:r2(m.cg),sgst:r2(m.sg),igst:r2(m.ig),round:r2(m.round),amount:m.grand};
}
function saleSave(){
 const f=RS.sf;if(!f)return; if(cur==="sale"&&f.id&&liveIrnLocked("sale",f.id)){alert("Live E-Invoice का IRN बन चुका है। Edit स्क्रीन खुल सकती है, लेकिन Save बंद है।");return} const rec=sfBuild();
 if(!String(f.no).trim()){alert(KC[cur].no+" is required");return}
 if(!f.date){alert("Date is required");return}
 if(!f.party){alert("Please select a party");return}
 if(!rec.items.length||rec.items.some(l=>!l.item||l.qty<=0)){alert("Add at least one item. Every row needs an item picked from the list and a quantity.");return}
 if(DB[cur].some(x=>x.id!==f.id&&x.inv===rec.inv&&(KC[cur].own||x.party===rec.party))){alert(KC[cur].no+" "+rec.inv+" already exists");return}
 const isNew=!f.id;
 if(isNew){rec.id=uid();DB[cur].push(rec)}else{const i=DB[cur].findIndex(x=>x.id===f.id);DB[cur][i]=rec}
 save();toast(M[cur].title+" "+rec.inv+" saved");
 RS.sf=isNew?newSaleForm():null;if(!isNew&&RS.back){cur=RS.back;RS.back=null}render();
}

/* ===== Pending bills for Receipt / Payment (auto-detect unpaid bills, tick to settle) ===== */
const BILLK={receipt:"sale",payment:"purchase"};
function pendBills(kind,party,skipId){
 const bk=BILLK[kind],rk=kind==="receipt"?"salereturn":"purchasereturn";
 if(isCashParty(DB.party.find(x=>x.id===party)))return [];
 const bills=DB[bk].filter(x=>x.party===party).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map(x=>({id:x.id,inv:String(x.inv||docNo(bk,x)),date:x.date,total:+x.amount||0,paid:0}));
 let pool=0;
 DB[kind].filter(r=>r.party===party&&r.id!==skipId).forEach(r=>{
  let al=0;
  (r.alloc||[]).forEach(a=>{
   let v=+a.amount||0;al+=v;
   const c=a.id?bills.filter(z=>z.id===a.id):bills.filter(z=>a.inv&&z.inv===String(a.inv));
   for(const b of c){const u=Math.min(v,Math.max(b.total-b.paid,0));b.paid+=u;v-=u;if(v<=0.005)break}
   pool+=Math.max(v,0)});
  pool+=Math.max((+r.amount||0)-al,0);
 });
 DB[rk].filter(r=>r.party===party).forEach(r=>{pool+=+r.amount||0});
 DB.journal.forEach(j=>{if((kind==="receipt"?j.cr:j.dr)===party)pool+=+j.amount||0});
 bills.forEach(b=>{const need=b.total-b.paid;if(need>0.005&&pool>0){const u=Math.min(need,pool);b.paid+=u;pool-=u}});
 return bills.map(b=>({...b,pend:r2(b.total-b.paid)})).filter(b=>b.pend>0.005);
}

 if(!L.length){el.innerHTML='<div class="bnote" style="margin-top:12px">No pending bills for this party.</div>';return}
 const tot=Object.values(S).reduce((a,v)=>a+v,0);
 el.innerHTML=`<div style="margin-top:14px;font-weight:600">Pending Bills <span class="bnote" style="font-weight:400">(tick the bills being settled)</span></div><div style="max-height:230px;overflow:auto;border:1px solid #e1e5f0;border-radius:8px;margin-top:6px"><table><tr><th></th><th>Bill No.</th><th>Date</th><th>Bill Amount</th><th>Pending</th><th>Settle</th></tr>${L.map(b=>{const on=S[b.id]!==undefined;return `<tr><td><input type="checkbox" style="width:auto" ${on?"checked":""} onchange="blTick('${b.id}',this.checked)"></td><td>${esc(b.inv)}</td><td>${b.date}</td><td>${n2(b.total)}</td><td>${n2(b.pend)}</td><td><input type="number" step="any" style="width:110px;padding:4px 6px" ${on?"":"disabled"} value="${on?S[b.id]:""}" onchange="blAmt('${b.id}',this.value)"></td></tr>`}).join("")}</table></div><div class="tot">Selected bills total: ₹ ${n2(tot)}</div><div class="bnote">Fully settled bills will not be shown again. If no bill is ticked, the amount is adjusted against the oldest pending bills automatically.</div>`;
}

 return runGstinValidation();

async function runGstinValidation(partyId){
 const parties=DB.party.filter(p=>(!partyId||p.id===partyId)&&String(p.gstin||"").trim());
 if(!parties.length){alert("Party Master में GSTIN वाली कोई party नहीं मिली.");return}
 const C=apiCfg();let cr={};try{cr=JSON.parse(C.live||"{}")}catch(e){alert("Other → Webtel API Settings में E-Invoice Live credentials का JSON ठीक करें.");return}
 const cd=cr.CDKey||cr.Cdkey||cr.cdkey,efU=cr.EFUserName,efP=cr.EFPassword,eiU=cr.EInvUserName||cr.EInvoiceUserName,eiP=cr.EInvPassword||cr.EInvoicePassword;
 if(!cd||!efU||!efP||!eiU||!eiP){alert("Bulk GSTIN lookup के लिए E-Invoice Live credentials में CDKey, EFUserName, EFPassword, EInvUserName और EInvPassword भरें.");return}
 if(!confirm((partyId?"इस पार्टी का GSTIN":""+parties.length+" GSTIN")+" की Webtel LIVE lookup होगी. जारी रखें?"))return;
 const box=document.getElementById("gstin_bulk_result");if(box)box.innerHTML='<div class="empty">GSTIN जाँचे जा रहे हैं… कृपया पेज बंद न करें.</div>';
 let ok=0,fail=0,updated=0,rows=[];
 const first=(o,keys)=>{for(const k of keys){const v=findAny(o,k);if(v!=="")return String(v)}return ""};
 const findAny=(o,k)=>{if(!o||typeof o!=="object")return "";for(const [a,v] of Object.entries(o)){if(a.toLowerCase()===k.toLowerCase()&&v!==null&&typeof v!=="object"&&String(v).trim()!=="")return v}for(const v of Object.values(o)){const z=findAny(v,k);if(z!=="")return z}return ""};
 for(let i=0;i<parties.length;i++){
  const p=parties[i],gst=String(p.gstin).trim().toUpperCase();
  try{
   const body={SearchGSTIN:gst,GSTIN:comp().gstin||gst,CDKey:cd,EInvUserName:eiU,EInvPassword:eiP,EFUserName:efU,EFPassword:efP};
   const res=await fetch("https://einvlive.webtel.in/v1.03/GetGSTINDetails/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
   const raw=await res.text();let j;try{j=JSON.parse(raw)}catch(e){throw new Error("API ने JSON response नहीं दिया (HTTP "+res.status+")")}
   if(!res.ok)throw new Error("HTTP "+res.status);
   const msg=first(j,["message","Message","ErrorMessage","error"]),status=first(j,["Status","status","IsValid","Valid"]);
   if(/invalid|not found|error|fail/i.test(msg)||status.toLowerCase()==="false"||status.toLowerCase()==="invalid")throw new Error(msg||"Invalid GSTIN");
   const map={name:["TradeName","tradeName","LegalName","LegalNm","Name","lgnm"],addr:["Address","Addr1","PrincipalPlaceOfBusiness","PrincipalAddress","pradr"],city:["City","Location","Loc","district","District"],pin:["Pincode","PinCode","Pin","pncd"],stcode:["StateCode","State_Code","Stcd","stateCode"]};
   let n=0;for(const [field,keys] of Object.entries(map)){const v=first(j,keys);if(v&&!String(p[field]||"").trim()){p[field]=v;n++}}
   p.gstinValidation="Valid";p.gstinCheckedAt=new Date().toISOString();ok++;updated+=n;rows.push([gst,"Valid",n+" field(s) updated"]);
  }catch(e){fail++;p.gstinValidation="Check Failed";p.gstinCheckError=String(e.message||e);rows.push([gst,"Failed",String(e.message||e)])}
  if(box)box.innerHTML='<div class="empty">Progress: '+(i+1)+' / '+parties.length+'</div>';
  save();
 }
 render();
 const out=document.getElementById("gstin_bulk_result");if(out)out.innerHTML=`<div class="pan" style="margin:10px 0"><b>${partyId?"Single Party GSTIN Result":"Bulk GSTIN Result"}</b><p>Checked: ${parties.length} &nbsp; Valid: ${ok} &nbsp; Failed: ${fail} &nbsp; Missing details updated: ${updated}</p>${tbl(["GSTIN","Result","Details"],rows)}</div>`;
}

function openForm(id){
 if(KC[cur]){openSale(id);return}
 editId=id||null;
 const m=M[cur],rec=id?DB[cur].find(x=>x.id===id):{};
 $("dt").textContent=(id?"Edit ":"New ")+m.title;
 if(cur==="receipt"||cur==="payment"){
  const prefix=cur==="receipt"?"REC":"PAY";
  const nextNo=()=>prefix+"-"+String((DB[cur]||[]).reduce((mx,x)=>Math.max(mx,parseInt(String(x.number||"").replace(/^.*?-/,""),10)||0),0)+(id?0:1)).padStart(3,"0");
  const account=rec.account||(rec.mode&&rec.mode!=="Cash"?"Bank Account":"Cash Account");
  const fields=[
   ["number","Voucher No.",rec.number||nextNo(),"text"],
   ["date","Date",rec.date||today(),"date"],
   ["party",cur==="receipt"?"Received From Party *":"Paid To Party *",rec.party||"","party"],
   ["account",cur==="receipt"?"Received In":"Paid From",account,"account"],
   ["amount",cur==="receipt"?"Received Amount (₹) *":"Payment Amount (₹) *",rec.amount??"","number"],
   ["tds","TDS Deducted (₹)",rec.tds??"","number"]
  ];
  const fieldHtml=fields.map(([k,l,v,t])=>{
   let el=t==="party"?'<select id="f_party"><option value="">Select party</option>'+DB.party.map(o=>`<option value="${o.id}" ${o.id===v?"selected":""}>${esc(o.name)}</option>`).join("")+'</select>':
    t==="account"?'<select id="f_account"><option '+(v==="Cash Account"?"selected":"")+' value="Cash Account">Cash Account</option><option '+(v==="Bank Account"?"selected":"")+' value="Bank Account">Bank Account</option></select>':
    `<input id="f_${k}" type="${t}" ${t==="number"?'step="any"':''} value="${esc(v)}">`;
   return `<div><label>${l}</label>${el}</div>`;
  }).join("");
  $("frm").innerHTML=`<div class="voucher-head"><div class="vicon">▣</div><div><div style="font-size:15px;font-weight:600">${m.title}</div><div style="font-size:11px;color:#6b7690">${cur==="receipt"?"Cash/Bank transaction entry":"Cash/Bank payment entry"}</div></div></div><div class="voucher-card"><div class="voucher-title"> ${cur==="receipt"?"Receipt":"Payment"} Details</div><div class="voucher-grid">${fieldHtml}<div class="wide"><label>Narration / Remarks</label><textarea id="f_remark" rows="3" placeholder="Enter details...">${esc(rec.remark||"")}</textarea></div></div><div id="bills" style="padding:0 18px"></div><div class="voucher-actions"><button type="button" class="g" onclick="clearVoucher()">Clear</button><button type="button" style="background:#fff;color:#111a33;border:1px solid #111a33" onclick="printVoucher()">▣ Print / Export</button></div></div>`;
  $("sv").textContent=cur==="receipt"?"▣ Save Receipt (F2)":"▣ Save Payment (F2)";
 }else{
  $("frm").innerHTML=m.f.map(f=>{
   const v=rec[f.k]??(f.t==="date"?today():"");
   let inp;
   if(f.src){
    inp=`<select id="f_${f.k}"><option value="">-- Select --</option>`+DB[f.src].map(o=>`<option value="${o.id}" ${o.id===v?"selected":""}>${esc(o.name)}</option>`).join("")+"</select>";
   }else if(f.opts){
    inp=`<select id="f_${f.k}">`+f.opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")+"</select>";
   }else if(f.t==="textarea"){inp=`<textarea id="f_${f.k}" rows="2">${esc(v)}</textarea>`}
   else inp=`<input id="f_${f.k}" type="${f.t||"text"}" ${f.t==="number"?'step="any"':""} value="${esc(v)}">`;
   return `<label>${f.l}${f.r?" *":""}</label>${inp}`;
  }).join("")+(m.tx?'<div class="tot" id="amt"></div>':"");
  $("sv").textContent="Save";
 }
 $("dlg").style.width=(cur==="receipt"||cur==="payment")?"min(720px,95vw)":"";
 if(cur==="receipt"||cur==="payment"){$("f_party").onchange=()=>blLoad();blLoad(id?rec:null)}
 if(m.tx){
  const calc=()=>{$("amt").textContent="Amount: ₹ "+((+$("f_qty").value||0)*(+$("f_rate").value||0)).toFixed(2)};
  $("f_qty").oninput=$("f_rate").oninput=calc;
  $("f_item").onchange=()=>{
   const it=DB.item.find(x=>x.id===$("f_item").value);
   if(it&&!$("f_rate").value)$("f_rate").value=(cur==="sale"||cur==="purchasereturn")?(it.srate||""):(it.prate||"");
   if(cur==="sale"||cur==="salereturn"){if(it)$("f_rate").value=it.srate||""}
   if(cur==="purchase"||cur==="purchasereturn"){if(it)$("f_rate").value=it.prate||""}
   calc();
  };
  calc();
 }
 if(!id&&M[cur].f.some(f=>f.k==="inv")&&invAuto(cur))$("f_inv").value=invNext(cur);
 $("dlg").showModal();
}

function clearVoucher(){
 ["number","date","party","account","amount","tds","remark"].forEach(k=>{const e=$("f_"+k);if(e)e.value=k==="date"?today():k==="account"?"Cash Account":k==="number"?(cur==="receipt"?"REC-":"PAY-")+String(DB[cur].length+1).padStart(3,"0"):""});
 RS.bl={sel:{},list:[]};blDraw();
}
function printVoucher(){
 const title=cur==="receipt"?"Receipt Voucher":"Payment Voucher";
 const labels=[["Voucher No.",$("f_number")?.value],["Date",$("f_date")?.value],["Party",lookup("party",$("f_party")?.value)],["Account",$("f_account")?.value],["Amount","₹ "+n2($("f_amount")?.value)],["TDS Deducted","₹ "+n2($("f_tds")?.value)],["Narration",$("f_remark")?.value]];
 const w=window.open("","_blank","width=800,height=650");
 if(!w){alert("Please allow pop-ups to print/export this voucher.");return}
 w.document.write("<html><head><title>"+title+"</title><style>body{font:14px Arial;padding:30px}h2{margin-bottom:25px}table{width:100%;border-collapse:collapse}td{padding:12px;border:1px solid #ddd}td:first-child{font-weight:bold;width:30%}</style></head><body><h2>"+title+"</h2><table>"+labels.map(x=>"<tr><td>"+x[0]+"</td><td>"+String(x[1]||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+"</td></tr>").join("")+"</table><script>window.onload=()=>window.print()<\/script></body></html>");
 w.document.close();
}
function saveForm(){
 const m=M[cur],rec={};
 for(const f of m.f){
  const el=$("f_"+f.k); if(!el)continue;
  const v=el.value.trim();
  if(f.r&&!v){alert(f.l+" is required");return}
  rec[f.k]=v;
 }
 if(cur==="receipt"||cur==="payment"){
  rec.mode=rec.account==="Cash Account"?"Cash":"Bank";
  rec.tds=+rec.tds||0;
  rec.number=rec.number||((cur==="receipt"?"REC-":"PAY-")+String(DB[cur].length+1).padStart(3,"0"));
  rec.remark=rec.remark||"";
 
  const S=RS.bl.sel,al=RS.bl.list.filter(b=>S[b.id]>0).map(b=>({id:b.id,inv:b.inv,amount:r2(S[b.id])})),t=al.reduce((a,x)=>a+x.amount,0);
  if(t>(+rec.amount||0)+0.005){alert("Selected bills total (₹ "+n2(t)+") is more than the Amount");return}
  rec.alloc=al;
 }
 if(cur==="journal"&&rec.dr===rec.cr){alert("Debit and Credit accounts must be different");return}
 if(m.tx)rec.amount=((+rec.qty||0)*(+rec.rate||0)).toFixed(2);
 if(editId){const i=DB[cur].findIndex(x=>x.id===editId);DB[cur][i]={...DB[cur][i],...rec}}
 else{const nid=uid();DB[cur].push({id:nid,...rec});if(RS.ret){if(cur==="party")RS.newParty=nid;if(cur==="item")RS.newItem=nid}}
 save();$("dlg").close();render();
}

function del(id){
 if(cur==="company"){coDel(id);return}
 if(cur==="sale"&&DB.sale.some(x=>x.id===id&&x.irn)){alert("इस Invoice का E-Invoice (IRN) बन चुका है। इसे Delete नहीं किया जा सकता।");return}
 if(!confirm("Are you sure you want to delete this record?"))return;
 if(cur==="party"||cur==="item"){
  const used=Object.keys(M).some(k=>k!==cur&&DB[k].some(r=>r.party===id||r.item===id||r.dr===id||r.cr===id||(r.items||[]).some(l=>l.item===id)));
  if(used&&!confirm("This record is used in other entries. Delete it anyway?"))return;
 }
 DB[cur]=DB[cur].filter(x=>x.id!==id);
 save();render();
}

$("add").onclick=()=>{if(KC[cur]&&RS.sf){RS.sf=null;if(RS.back){cur=RS.back;RS.back=null}render();return}if(cur==="dashboard"){cur="company";render()}openForm()};
document.addEventListener("keydown",e=>{if(e.key==="F2"&&KC[cur]&&RS.sf){e.preventDefault();saleSave()}});
$("sv").onclick=saveForm;
$("cx").onclick=()=>$("dlg").close();

$("q").oninput=render;
render();
gstReminderCheck(false);
bkInit();
