<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounting & Stock Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5f9;color:#1d2433;display:flex;min-height:100vh}
nav{width:230px;background:#0f1a3a;color:#fff;padding:14px 10px;flex-shrink:0}
nav h2{font-size:16px;margin:0 8px 14px;color:#9fb4ff}
.gh{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:16px;font-weight:600;cursor:pointer;border-radius:8px;color:#e6ebff}
.gh:hover{background:#1a2850}
.gh .ar{margin-left:auto;transition:transform .2s;font-size:13px}
.grp.shut .ar{transform:rotate(180deg)}
.grp.shut .gb{display:none}
.gb{margin:2px 0 8px 22px;border-left:1px solid #34436e;padding-left:6px}
.gb a{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#cfd6e6;cursor:pointer;font-size:13px;font-weight:600;border-radius:6px}
.gb a:hover{background:#1a2850}
.gb a.on{background:#3d5afe;color:#fff}
.sub{margin-left:14px;border-left:1px solid #34436e;padding-left:4px}
.sub.shut{display:none}
.gb a .ar2{margin-left:auto;font-size:12px}
.ctl{display:flex;gap:10px;padding:12px;flex-wrap:wrap;align-items:end}
.ctl div{min-width:150px}
.ctl label{margin:0 0 3px}
.top{display:flex;align-items:center;gap:22px;background:#fff;border-radius:12px;padding:12px 18px;margin-bottom:18px;box-shadow:0 1px 4px #0001;flex-wrap:wrap}
.tc{display:flex;align-items:center;gap:10px}
.tc .ic{background:#eef1ff;border-radius:10px;padding:9px;font-size:18px}
.tc small{display:block;font-size:10px;color:#6b7690;letter-spacing:.5px}
.top select{border:0;font-weight:700;font-size:15px;padding:0;width:auto;background:transparent;cursor:pointer}
.badge{background:#e3f7ec;color:#14803c;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;margin-left:auto}
.av{background:#111a33;color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
nav .top1{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;border-radius:10px;color:#e6ebff;font-weight:600;font-size:16px;cursor:pointer}
nav .top1:hover{background:#1a2850}
nav .top1.on{background:#3d5afe;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kp{background:#fff;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px #0001}
.kp .ki{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.kp small{display:block;font-size:12px;color:#6b7690}
.kp b{font-size:20px;display:block;margin:2px 0}
.kp i{font-style:normal;font-size:11px;color:#6b7690}
.dash2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.dash2{grid-template-columns:1fr}}
.pan{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px #0001}
.pan>small{display:block;font-size:11px;color:#6b7690;margin:2px 0 8px}
.chart{display:flex;align-items:flex-end;gap:12px;height:230px;border-bottom:1px solid #e6e9f2;padding-top:10px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;color:#8a94a8}
.bar2{width:70%;max-width:34px;background:linear-gradient(#5b7cff,#3d5afe);border-radius:6px 6px 0 0;margin-bottom:4px}
.bar2.z{background:#e3e7f0}
.fys{text-align:right;font-size:12px;color:#6b7690;margin-top:10px}
.fys b{color:#1d2433;font-size:14px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qt{display:flex;align-items:center;gap:8px;border:1px solid #e1e5f0;border-radius:10px;padding:16px 12px;font-size:13px;font-weight:600;cursor:pointer}
.qt:hover{border-color:#3d5afe;background:#f5f7ff}
.qt b{margin-left:auto;color:#3d5afe;font-size:18px}
.gate{background:#fff;border-radius:14px;padding:56px 20px;box-shadow:0 1px 4px #0001}
.gbox{max-width:420px;margin:0 auto;text-align:center}
.gico{width:68px;height:68px;border-radius:18px;background:#e8edff;color:#3d5afe;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.gbox h2{margin:0 0 8px;font-size:21px;font-weight:600}
.gbox p{margin:0 0 24px;font-size:13px;color:#4a63b8}
.gbox label{text-align:left;font-weight:700;font-size:12px;color:#1d2433;margin:0 0 6px}
.gbox input{padding:14px;border:2px solid #c5cbd8;border-radius:10px;font-size:18px;text-align:center;letter-spacing:6px;margin-bottom:12px;background:#fff}
.gbox input:focus{outline:0;border-color:#3d5afe;box-shadow:0 0 0 3px #3d5afe22}
.gbtn{width:100%;padding:14px;border-radius:10px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.gbtn:disabled{background:#9fb0f5;cursor:not-allowed}
.gerr{color:#e53935;font-size:13px;margin-top:12px}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.ic2{background:#fff;border:1px solid #e1e5f0;border-radius:14px;padding:18px}
.ic2 .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:15px}
.bdg{font-size:11px;font-weight:700;padding:4px 11px;border-radius:12px}
.bdg.a{background:#e3f7ec;color:#14803c}
.bdg.m{background:#eef0f5;color:#6b7690}
.ic2 label{font-size:12px;font-weight:700;margin:0 0 5px;color:#475069}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{background:#f5f6fa;border-radius:10px;padding:12px 14px;margin-top:14px}
.pv small{display:block;font-size:11px;font-weight:700;color:#6b7690;margin-bottom:6px}
.pv b{font-size:15px}
.isave{display:flex;align-items:center;gap:8px;padding:11px 18px;font-weight:600}
.sc{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;margin-bottom:16px;overflow:hidden}
.sc .sh{padding:16px 20px;border-bottom:1px solid #eceff5;font-weight:700;font-size:14px}
.sc .sb{padding:16px 20px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.g4 label,.sc label{font-size:11px;font-weight:700;color:#475069;margin:0 0 5px}
.ro{background:#f3f5f9;color:#475069}
.hd2{display:flex;align-items:center;gap:14px;padding:18px 20px}
.hico{width:46px;height:46px;border-radius:12px;background:#e8edff;display:flex;align-items:center;justify-content:center;font-size:20px}
.bdg.w{background:#fff0d9;color:#b26a00}
.it{width:100%;border-collapse:collapse;font-size:13px;min-width:1040px}
.it th{background:#f6f7fb;font-size:11px;color:#6b7690;padding:10px 8px;text-align:left}
.it td{padding:8px;border-top:1px solid #eef0f5;white-space:nowrap}
.it input,.it select{padding:7px 8px;font-size:13px}
.sbot{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.sbot{grid-template-columns:1fr}}
.tp>div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #e1e5f0;font-size:13px}
.tp .gt{background:#111a33;color:#fff;border:0;border-radius:10px;padding:16px;margin-top:12px;font-size:14px;align-items:center}
.tp .gt b{font-size:20px}
.ol{background:#fff;color:#111a33;border:1.5px solid #111a33;padding:10px 18px;font-weight:600}
.lnk{color:#3d5afe;cursor:pointer;font-size:12px;font-weight:600}
.toast{position:fixed;right:22px;bottom:22px;background:#111a33;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 4px 18px #0004}
.bk3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.bcard{background:#fff;border:1px solid #e1e5f0;border-radius:16px;padding:26px;display:flex;flex-direction:column;min-height:340px}
.bico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.bcard h3{margin:0 0 10px;font-size:17px}
.bcard p{margin:0;font-size:14px;color:#5b6784;line-height:1.7}
.bfoot{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-top:16px}
.bfoot button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;white-space:nowrap}
.bst{border-radius:10px;padding:12px 14px;font-size:13px;font-weight:600;margin:16px 0 8px}
.bst.ok{background:#e8f7ee;color:#14803c}.bst.no{background:#f1f3f8;color:#6b7690}.bst.wn{background:#fff4de;color:#b26a00}
button:disabled{opacity:.5;cursor:not-allowed}
.bnote{font-size:12px;color:#6b7690;margin-top:4px}
.kp{cursor:pointer;transition:box-shadow .15s,transform .15s}
.kp:hover{box-shadow:0 4px 14px #0002;transform:translateY(-1px)}
main{flex:1;padding:20px;overflow:auto;min-width:0}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar h1{margin:0;font-size:22px;flex:1}
input,select,textarea{padding:8px 10px;border:1px solid #c5cbd8;border-radius:6px;font-size:14px;width:100%;font-family:inherit}
.bar input{width:200px}
button{padding:8px 14px;border:0;border-radius:6px;cursor:pointer;font-size:14px;background:#3d5afe;color:#fff}
button.e{background:#f0a500;padding:5px 10px}
button.d{background:#e53935;padding:5px 10px}
button.g{background:#8a94a8}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px #0002;overflow:auto;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#e8ecf7;text-align:left;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid #eceff5}
.empty{padding:24px;text-align:center;color:#8a94a8}
dialog{border:0;border-radius:10px;padding:20px;width:min(460px,94vw);box-shadow:0 8px 30px #0005}
dialog::backdrop{background:#0006}
.voucher-head{background:#fff;border:1px solid #e1e5f0;border-radius:13px;padding:18px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.voucher-head .vicon{width:40px;height:40px;border-radius:10px;background:#e8edff;color:#315bff;display:grid;place-items:center;font-size:20px}
.voucher-card{background:#fff;border:1px solid #e1e5f0;border-radius:13px;overflow:hidden}
.voucher-title{padding:15px 18px;border-bottom:1px solid #e1e5f0;font-weight:700}
.voucher-grid{padding:16px 18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.voucher-grid label{font-size:11px;font-weight:700;color:#475069;margin:0 0 6px}
.voucher-grid input,.voucher-grid select{height:39px}.voucher-grid select{background:#fff}.voucher-title{font-size:13px}
.voucher-grid .wide{grid-column:1/-1}
.voucher-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px;flex-wrap:wrap}
.vno{display:flex;border:1px solid #cfd6ea;border-radius:8px;overflow:hidden;height:39px;background:#fff}.vno span{background:#eef1f7;padding:0 10px;display:flex;align-items:center;font-weight:700;font-size:13px}.vno input{border:0;flex:1;height:100%;min-width:0}.voucher-grid input.vamt{height:50px;font-size:20px;font-weight:800;color:#111a33}.voucher-grid input.vamt::placeholder{color:#a3acc0;font-weight:700}.voucher-actions button:last-child{padding:9px 16px}
.authov{position:fixed;inset:0;background:#f2f4fa;z-index:9999;display:flex;align-items:center;justify-content:center}
.authbox{background:#fff;border-radius:16px;padding:34px 30px;width:min(380px,92vw);box-shadow:0 8px 30px #1a2a5522;text-align:center}
.authbox h2{margin:0 0 4px;font-size:22px}.authbox p{margin:0 0 20px;color:#6b7690;font-size:13px}
.authbox label{display:block;text-align:left;font-size:12px;font-weight:700;color:#1d2433;margin:12px 0 6px}
.authbox input{width:100%;height:42px}.authbox button{width:100%;margin-top:18px;height:44px;background:#3151d3;color:#fff;border:0;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
.authbox .aerr{color:#d6264f;font-size:12px;min-height:16px;margin-top:10px}
.ucos{display:flex;flex-wrap:wrap;gap:8px 18px;padding:4px 0}.ucos label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#1d2433;margin:0}.ucos input{width:auto;height:auto}
.jhead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px}.jhead b{font-size:13px}
.jlink{background:none;border:0;color:#315bff;font-weight:700;font-size:12px;cursor:pointer;padding:0}
.jwrap{overflow-x:auto}.jtbl{width:100%;border-collapse:collapse;min-width:640px}
.jtbl th{background:#f7f9fc;font-size:10px;letter-spacing:.4px;color:#475069;text-align:left;padding:12px 18px;border-top:1px solid #e1e5f0;border-bottom:1px solid #e1e5f0;text-transform:uppercase}
.jtbl td{padding:9px 18px;border-bottom:1px solid #eef1f7;font-size:12px;vertical-align:middle}
.jtbl select,.jtbl input{height:36px;width:100%;font-size:12px}
.jtbl tfoot td{background:#f7f9fc;font-weight:800;font-size:15px;border-top:2px solid #cfd6ea;border-bottom:0;padding:14px 18px}
.jtbl tfoot td:first-child,.jtbl tfoot td:nth-child(2){font-size:12px}
.jx{background:none;border:0;color:#f0a3b3;font-size:15px;cursor:pointer;padding:4px 8px}.jx:hover{color:#d6264f}
.jdiff{height:39px;border:1px solid #cfd6ea;border-radius:8px;background:#eef1f7;display:flex;align-items:center;padding:0 12px;font-weight:800;font-size:13px}
.jser{background:#eef1f7;color:#475069}
@media(max-width:760px){.voucher-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:440px){.voucher-grid{grid-template-columns:1fr}}

dialog.cmp{width:min(900px,95vw);padding:0;border-radius:14px;overflow:hidden}
dialog.cmp #dt{margin:0;padding:22px 26px 0;font-size:20px;color:#1d2433}
dialog.cmp .cx-x{position:absolute;right:18px;top:16px;background:none;border:0;color:#475069;font-size:20px;cursor:pointer;padding:4px 8px}
dialog.cmp .csub{padding:2px 26px 12px;font-size:11px;color:#6b7690}
dialog.cmp #frm{max-height:min(62vh,520px);overflow-y:auto;margin:0 26px;padding:14px 14px 4px;background:#f7f9fc;border-radius:8px}
dialog.cmp .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
dialog.cmp .cgrid .wide{grid-column:1/-1}
dialog.cmp .cgrid label{font-size:11px;font-weight:700;color:#1d2433;margin:0 0 6px}
dialog.cmp .cgrid input,dialog.cmp .cgrid select,dialog.cmp .cgrid textarea{width:100%;height:40px;border:1px solid #d5dbea;border-radius:10px;background:#fbfcff;padding:0 14px;font-size:15px;box-sizing:border-box}
dialog.cmp .cgrid select{font-size:13px}
dialog.cmp .cgrid textarea{height:auto;padding:10px 14px;font-family:inherit}
dialog.cmp .cgrid input:focus,dialog.cmp .cgrid select:focus,dialog.cmp .cgrid textarea:focus{outline:0;border-color:#3151d3;box-shadow:0 0 0 2px #3151d322}
dialog.cmp .csec{grid-column:1/-1;font-size:12px;font-weight:800;color:#3151d3;border-bottom:1px solid #dfe5f3;padding:6px 0 4px;margin-top:6px}
dialog.cmp .btns{margin:0;padding:16px 26px 20px}
dialog.cmp .btns button{height:38px;border-radius:9px;padding:0 18px;font-weight:700}
dialog.cmp .btns .g{background:#fff;color:#111a33;border:1.5px solid #111a33}
dialog.cmp #sv{background:#3151d3;color:#fff;border:0}
@media(max-width:640px){dialog.cmp .cgrid{grid-template-columns:1fr}}
label{display:block;font-size:13px;margin:10px 0 3px;color:#475069}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.tot{padding:10px;text-align:right;font-weight:600}
.neg{color:#e53935}
h3{margin:4px 0 8px}
dialog.cmp.pty{width:min(1000px,96vw)}
dialog.cmp.pty #frm{max-height:min(70vh,560px)}
dialog.cmp.pty .cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:820px){dialog.cmp.pty .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){dialog.cmp.pty .cgrid{grid-template-columns:1fr}}
.rfb{background:#f8faff;border:1px solid #dce4f5;border-radius:10px;padding:12px;margin:10px 0}
.rfb .ctl{padding:8px 0 0}
.rfb .ctl div{min-width:130px}
.pc small{display:block;font-size:11px;color:#6b7690;font-weight:400}

/* Central database sign-in */
.cloudov{position:fixed;inset:0;z-index:99999;background:rgba(8,16,38,.88);display:none;align-items:center;justify-content:center;padding:18px}
.cloudbox{width:min(420px,100%);background:#fff;border-radius:16px;padding:26px;box-shadow:0 18px 60px #0005;color:#1d2433}
.cloudbox h2{margin:8px 0}.cloudbox p{color:#667085;font-size:13px;line-height:1.5}.cloudbox label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}.cloudbox input{width:100%;padding:12px;border:1px solid #ccd2df;border-radius:8px;font-size:15px}.cloudbox button{width:100%;margin-top:16px;padding:12px;background:#3151d3;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}.clouderr{color:#c62828;font-size:13px;margin-top:10px;white-space:pre-wrap}.cloudstatus{font-size:12px;color:#168044;margin-top:10px}

/* Mobile / tablet responsive layout */
#mobileMenuBtn{display:none}
#mobileNavShade{display:none}
html,body{max-width:100%;overflow-x:hidden}
main{min-width:0;width:calc(100% - 230px)}
.card,.sc,.voucher-card,.pan{min-width:0;max-width:100%}
@media(max-width:820px){
 body{display:block;min-height:100vh}
 nav#nav{position:fixed;left:0;top:0;bottom:0;width:min(290px,84vw);height:100dvh;overflow-y:auto;z-index:10020;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 28px #0003;padding-bottom:28px}
 nav#nav.mobile-open{transform:translateX(0)}
 #mobileNavShade{display:block;position:fixed;inset:0;background:#07112680;z-index:10010;opacity:0;pointer-events:none;transition:opacity .2s}

 main{width:100%;padding:12px;overflow-x:hidden}
 #mobileMenuBtn{display:inline-flex;align-items:center;gap:8px;background:#111a33;color:#fff;border-radius:9px;padding:10px 14px;margin:0 0 12px;font-weight:700;min-height:42px}
 .top{padding:11px 12px;gap:10px;margin-bottom:12px}
 .top .badge{margin-left:0}
 .bar{gap:8px}
 .bar h1{font-size:19px;flex-basis:100%}
 .bar input{width:min(100%,220px);flex:1;min-width:120px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .kp{padding:12px;gap:8px;min-width:0}
 .kp .ki{width:36px;height:36px;flex:0 0 36px}
 .kp b{font-size:17px;overflow-wrap:anywhere}
 .dash2,.sbot{grid-template-columns:1fr}
 .ig,.bk3{grid-template-columns:1fr}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .two{grid-template-columns:1fr}
 .ctl{padding:8px 0;gap:8px}
 .ctl div{min-width:min(100%,145px);flex:1}
 .sc .sb,.sc .sh{padding:12px}
 .pan{padding:13px}
 .card{overflow-x:auto;-webkit-overflow-scrolling:touch}
 table{min-width:680px}
 .it{min-width:900px}
 .voucher-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px;gap:10px}
 .voucher-head{padding:12px}
 dialog{max-width:calc(100vw - 20px);max-height:90dvh;overflow:auto}
 dialog.cmp{width:calc(100vw - 16px);max-width:calc(100vw - 16px)}
 dialog.cmp #dt{padding:18px 16px 0;font-size:18px}
 dialog.cmp .csub{padding:4px 16px 10px}
 dialog.cmp #frm{margin:0 12px;padding:12px;max-height:58dvh}
 dialog.cmp .cgrid{grid-template-columns:1fr;gap:10px}
 dialog.cmp .cgrid .wide{grid-column:auto}

 .jwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

@media(max-width:480px){
 main{padding:9px}
 .kpis{grid-template-columns:1fr 1fr}
 .kp{padding:10px}
 .kp b{font-size:15px}
 .g4,.two{grid-template-columns:1fr}
 .voucher-grid{grid-template-columns:1fr}
 .top{align-items:flex-start}
 .tc{min-width:0;flex-wrap:wrap}
 .badge{font-size:10px;padding:5px 8px}
 .bar button{padding:9px 11px}

function apoRows(){
 const lim=i=>i.minq===undefined||i.minq===""?10:+i.minq;
 return DB.item.map(i=>{const st=stockQty(i),pend=DB.po.filter(x=>x.item===i.id&&x.status==="Pending").reduce((a,x)=>a+(+x.qty||0),0),av=st+pend,lm=lim(i);
  return {i,st,pend,av,lm,sug:+i.roq>0?+i.roq:Math.max(1,2*lm-av)}}).filter(r=>r.av<=r.lm);
}
function apoSet(id,k,v){const A=RS.apo=RS.apo||{};(A[id]=A[id]||{})[k]=v}
function genPO(){
 const A=RS.apo=RS.apo||{};let n=0;const miss=[];
 apoRows().forEach(r=>{const a=A[r.i.id]||{},on=a.on??true,qty=+(a.qty??r.sug),party=a.party??r.i.supp??"";
  if(!on||!(qty>0))return;
  if(!party){miss.push(r.i.name);return}
  DB.po.push({id:uid(),date:today(),party,item:r.i.id,qty:String(qty),rate:String(r.i.prate||0),status:"Pending",remark:"Auto PO",amount:n2(qty*(+r.i.prate||0))});
  delete A[r.i.id];n++});
 save();
 let msg=n+" purchase order(s) created.";
 if(miss.length)msg+="\nSelect a supplier for: "+miss.join(", ");
 alert(msg);
 if(n){cur="po"}
 render();
}

function billShrink(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>ok({blob:b,b64:cv.toDataURL("image/jpeg",0.85).split(",")[1]}),"image/jpeg",0.8)};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}
const billNorm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function billScore(a,b){a=billNorm(a);b=billNorm(b);if(!a||!b)return 0;if(a===b)return 1;const A=new Set(a.split(" ")),B=b.split(" ");const hit=B.filter(w=>A.has(w)).length;return hit/Math.max(A.size,B.length)}
function billMatchItem(desc,hsn){let best=null,bs=0;DB.item.forEach(i=>{let s=Math.max(billScore(i.name,desc),i.code?billScore(i.code,desc):0);if(s>0&&hsn&&i.hsn&&String(i.hsn)===String(hsn))s+=0.1;if(s>bs){bs=s;best=i}});return bs>=0.6?best:null}
function billApply(d,blob){
 const k=cur,sale=(k==="sale"||k==="salereturn");
  const f=RS.sf,warn=[];
  const pg=String((sale?d.buyer_gstin:d.seller_gstin)||"").toUpperCase().replace(/\s/g,""),pn=sale?d.buyer_name:d.seller_name;
  let pt=pg?DB.party.find(p=>String(p.gstin||"").toUpperCase()===pg):null;
  if(!pt&&pn){let bs=0;DB.party.forEach(p=>{const s=billScore(p.name,pn);if(s>bs){bs=s;pt=p}});if(bs<0.6)pt=null}
  if(pt){f.party=pt.id;f.gstin=pt.gstin||pg;f.pos=stc(pt)||f.pos}
  else{f.party="";f.gstin=pg;if(pg.length>=2)f.pos=pg.slice(0,2);warn.push("Party <b>"+esc(pn||"?")+"</b> "+(pg?"(GSTIN "+esc(pg)+") ":"")+"not found in Party Master — add it, then select it.")}
  if(d.invoice_no){f.no=invAuto(k)?String(d.invoice_no).replace(/\D/g,"")||String(d.invoice_no):String(d.invoice_no)}
  if(/^\d{4}-\d\d-\d\d$/.test(d.date||""))f.date=d.date;
  const rate=+(d.igst_percent||0)+(+d.cgst_percent||0)+(+d.sgst_percent||0)||18;
  const miss=[];
  f.items=(d.items||[]).filter(x=>x.description||x.qty).map(x=>{
   const l=blankLine(),it=billMatchItem(x.description,x.hsn);
   l.qty=String(x.qty||"");l.rate=String(x.rate||"");l.hsn=String(x.hsn||"");l.gst=String(rate);
   const u=UNITS.find(z=>z.toLowerCase()===String(x.unit||"").toLowerCase().replace(/^kgs?$/,"kg").replace(/^(ltrs?|liters?|litres?)$/,"ltr").replace(/^pc$/,"pcs"));if(u)l.unit=u;
   if(it){l.item=it.id;l.name=it.name;if(!l.hsn)l.hsn=it.hsn||"";if(!u)l.unit=UNITS.find(z=>z.toLowerCase()===String(it.unit||"").toLowerCase())||"Nos"}
   else{l.item="";l.name=x.description||"";miss.push({l,x})}
   return l});
  if(!f.items.length)f.items=[blankLine()];
  RS.billMiss=miss;f.billBlob=blob||null;
  const m=sfCompute(),gt=+d.grand_total||0;
  if(gt&&Math.abs(m.grand-gt)>1)warn.push("Total mismatch: bill says <b>₹"+n2(gt)+"</b>, entry computes <b>₹"+n2(m.grand)+"</b>. Check qty/rate/GST on each line.");
  if(miss.length)warn.push(miss.length+" item(s) not in Item Master: "+miss.map(z=>"<b>"+esc(z.x.description)+"</b>").join(", ")+". <a class=\"lnk\" onclick=\"billMakeItems()\">Create these items automatically</a>");
  RS.billMsg="✅ Bill read. <b>Check everything below, then Save.</b>"+(warn.length?"<br>⚠ "+warn.join("<br>⚠ "):"");
}

  const prompt_=`This is a photo of an Indian GST tax invoice (may be rotated/sideways, handwritten entries, pink carbon copy). Read it carefully and return ONLY a JSON object, no other text:
{"invoice_no":"","date":"YYYY-MM-DD","seller_name":"","seller_gstin":"","buyer_name":"","buyer_gstin":"","buyer_state_code":"","items":[{"description":"","hsn":"","qty":0,"unit":"","rate":0,"amount":0}],"taxable_total":0,"igst_percent":0,"cgst_percent":0,"sgst_percent":0,"tax_total":0,"grand_total":0}

  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":aiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:AI_MODEL,max_tokens:2000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt_}]}]})});
  const j=await r.json();if(!r.ok)if(r.status===401){try{localStorage.removeItem("acc_ai_key")}catch(e){}}throw new Error(r.status===401?"The saved AI key was rejected, so it has been removed. Use Paste bill data instead, or set a valid Anthropic key (sk-ant-...).":r.status===400&&/credit/i.test((j.error&&j.error.message)||"")?"No API credits. Add credits in console.anthropic.com > Billing.":((j.error&&j.error.message)||("HTTP "+r.status)));

 render();
}

/* ===== Pending bills for Receipt / Payment (auto-detect unpaid bills, tick to settle) ===== */
const BILLK={receipt:"sale",payment:"purchase"};
function pendBills(kind,party,skipId){
 const bk=BILLK[kind],rk=kind==="receipt"?"salereturn":"purchasereturn";
 if(isCashParty(DB.party.find(x=>x.id===party)))return [];
 const bills=DB[bk].filter(x=>x.party===party).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map(x=>({id:x.id,inv:String(x.inv||docNo(bk,x)),date:x.date,total:+x.amount||0,paid:0}));
 let pool=0;
 DB[kind].filter(r=>r.party===party&&r.id!==skipId).forEach(r=>{
  let al=0;
  (r.alloc||[]).forEach(a=>{
   let v=+a.amount||0;al+=v;
   const c=a.id?bills.filter(z=>z.id===a.id):bills.filter(z=>a.inv&&z.inv===String(a.inv));
   for(const b of c){const u=Math.min(v,Math.max(b.total-b.paid,0));b.paid+=u;v-=u;if(v<=0.005)break}
   pool+=Math.max(v,0)});
  pool+=Math.max((+r.amount||0)+(+r.tds||0)-al,0);
 });
 DB[rk].filter(r=>r.party===party).forEach(r=>{pool+=+r.amount||0});
 DB.journal.forEach(j=>jLines(j).forEach(l=>{if(l.acc===party)pool+=kind==="receipt"?l.cr:l.dr}));
 bills.forEach(b=>{const need=b.total-b.paid;if(need>0.005&&pool>0){const u=Math.min(need,pool);b.paid+=u;pool-=u}});
 return bills.map(b=>({...b,pend:r2(b.total-b.paid)})).filter(b=>b.pend>0.005);
}
RS.bl={sel:{},list:[]};
function blLoad(init){
 const p=$("f_party").value,L=p?pendBills(cur,p,editId):[],sel={};
 if(init)(init.alloc||[]).forEach(a=>{const b=L.find(z=>(a.id&&z.id===a.id)||(!a.id&&a.inv&&z.inv===String(a.inv)));if(b)sel[b.id]=Math.min(+a.amount||0,b.pend)});
 RS.bl={sel,list:L};blDraw();
}
function blSync(){const S=RS.bl.sel;if(Object.keys(S).length)$("f_amount").value=Math.max(r2(Object.values(S).reduce((a,v)=>a+v,0)-(+(($("f_tds")||{}).value)||0)),0)}
function blTick(id,on){const b=RS.bl.list.find(z=>z.id===id);if(!b)return;if(on)RS.bl.sel[id]=b.pend;else delete RS.bl.sel[id];blSync();blDraw()}
function blAmt(id,v){const b=RS.bl.list.find(z=>z.id===id);if(!b)return;RS.bl.sel[id]=Math.min(Math.max(+v||0,0),b.pend);blSync();blDraw()}
function blAll(on){RS.bl.sel={};if(on)RS.bl.list.forEach(b=>{RS.bl.sel[b.id]=b.pend});blSync();blDraw()}
function blAuto(){
 const L=RS.bl.list;if(!L.length)return;
 let left=r2((+$("f_amount").value||0)+(+(($("f_tds")||{}).value)||0));const sel={};
 for(const b of L){if(left<=0.005)break;const u=Math.min(b.pend,left);sel[b.id]=r2(u);left=r2(left-u)}
 RS.bl.sel=sel;blDraw();
}
function blDraw(){
 const el=$("bills");if(!el)return;
 const L=RS.bl.list,S=RS.bl.sel;
 if(!$("f_party").value){el.innerHTML="";return}
 if(!L.length){el.innerHTML='<div class="bnote" style="margin-top:12px">No pending bills for this party.</div>';return}
 const tot=Object.values(S).reduce((a,v)=>a+v,0);
 el.innerHTML=`<div style="margin-top:14px;font-weight:600">Pending Bills <span class="bnote" style="font-weight:400">(tick the bills being settled — Amount updates automatically; typing an Amount ticks the oldest bills first)</span></div><div style="max-height:230px;overflow:auto;border:1px solid #e1e5f0;border-radius:8px;margin-top:6px"><table><tr><th><input type="checkbox" style="width:auto" ${L.length&&L.every(b=>S[b.id]!==undefined)?"checked":""} onchange="blAll(this.checked)" title="Select all"></th><th>Bill No.</th><th>Date</th><th>Bill Amount</th><th>Pending</th><th>Settle</th></tr>${L.map(b=>{const on=S[b.id]!==undefined;return `<tr><td><input type="checkbox" style="width:auto" ${on?"checked":""} onchange="blTick('${b.id}',this.checked)"></td><td>${esc(b.inv)}</td><td>${fd(b.date)}</td><td>${n2(b.total)}</td><td>${n2(b.pend)}</td><td><input type="number" step="any" style="width:110px;padding:4px 6px" ${on?"":"disabled"} value="${on?S[b.id]:""}" onchange="blAmt('${b.id}',this.value)"></td></tr>`}).join("")}</table></div><div class="tot">Selected bills total: ₹ ${n2(tot)} <small style="color:#6b7690">(Amount + TDS)</small></div><div class="bnote">Fully settled bills will not be shown again. If no bill is ticked, the amount is adjusted against the oldest pending bills automatically.</div>`;
}

async function runGstinValidation(partyId){
 const parties=DB.party.filter(p=>(!partyId||p.id===partyId)&&String(p.gstin||"").trim());
 if(!parties.length){alert("No party with a GSTIN was found in Party Master.");return}
 let GC;try{GC=normalizeApiCreds(JSON.parse(gstSeed().gst||"{}"))}catch(e){alert("The GSTIN Validate credentials in Webtel API Settings are not valid. Please re-enter them (Other → Webtel API Settings).");return}
 const cd=String(GC.CDKey||"").trim(),efU=String(GC.EFUserName||"").trim(),efP=String(GC.EFPassword||"").trim(),eiU=String(GC.EInvUserName||"").trim(),eiP=String(GC.EInvPassword||"").trim(),cgst=String(comp().gstin||"").trim().toUpperCase();
 const miss=[["CD Key",cd],["EF User",efU],["EF Password",efP],["E-Invoice User",eiU],["E-Invoice Password",eiP],["Company GSTIN (Company Master)",cgst]].filter(z=>!z[1]).map(z=>z[0]);
 if(miss.length){alert("These details are missing for the current company ("+(comp().name||"-")+"):\n"+miss.join(", ")+"\n\nEnter them in Other → Webtel API Settings → GSTIN Validate Credentials (or Company Master) and try again.");return}
 if(!confirm((partyId?"this party's GSTIN":""+parties.length+" GSTIN")+": a Webtel LIVE lookup will be done. Continue?"))return;
 const box=document.getElementById("gstin_bulk_result");if(box)box.innerHTML='<div class="empty">Checking GSTIN… please do not close the page.</div>';
 let ok=0,fail=0,updated=0,rows=[];
 const first=(o,keys)=>{for(const k of keys){const v=findAny(o,k);if(v!=="")return String(v)}return ""};
 const findAny=(o,k)=>{if(!o||typeof o!=="object")return "";for(const [a,v] of Object.entries(o)){if(a.toLowerCase()===k.toLowerCase()&&v!==null&&typeof v!=="object"&&String(v).trim()!=="")return v}for(const v of Object.values(o)){const z=findAny(v,k);if(z!=="")return z}return ""};
 for(let i=0;i<parties.length;i++){
  const p=parties[i],gst=String(p.gstin).trim().toUpperCase();
  try{
   const body={SearchGSTIN:gst,GSTIN:cgst,CDKey:cd,EInvUserName:eiU,EInvPassword:eiP,EFUserName:efU,EFPassword:efP};
   const u0=urlOf("gstin",ACTS.gstin[0]),up=u0.replace(/^http:/i,"https:"),cands=up===u0?[u0]:(location.protocol==="https:"?[up,u0]:[u0,up]);let res,le;for(const u of cands){try{res=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});break}catch(er){le=er}}if(!res)throw new Error("Request failed: "+(le&&le.message)+" (tried "+cands.join(" and ")+")");
   const raw=await res.text();let j;try{j=JSON.parse(raw)}catch(e){throw new Error("API did not return a JSON response (HTTP "+res.status+")")}
   if(!res.ok)throw new Error("HTTP "+res.status);
   const msg=first(j,["message","Message","ErrorMessage","error"]),status=first(j,["Status","status","IsValid","Valid"]);
   if(/invalid|not found|error|fail/i.test(msg)||status.toLowerCase()==="false"||status.toLowerCase()==="invalid")throw new Error(msg||"Invalid GSTIN");
   const map={name:["TradeName","tradeName","LegalName","LegalNm","Name","lgnm"],addr:["Address","Addr1","PrincipalPlaceOfBusiness","PrincipalAddress","pradr"],city:["City","Location","Loc","district","District"],pin:["Pincode","PinCode","Pin","pncd"],stcode:["StateCode","State_Code","Stcd","stateCode"]};
   let n=0;for(const [field,keys] of Object.entries(map)){const v=first(j,keys);if(v&&!String(p[field]||"").trim()){p[field]=v;n++}}
   p.gstinValidation="Valid";p.gstinCheckedAt=new Date().toISOString();ok++;updated+=n;rows.push([gst,"Valid",n+" field(s) updated"]);
  }catch(e){fail++;p.gstinValidation="Check Failed";p.gstinCheckError=String(e.message||e);rows.push([gst,"Failed",String(e.message||e)])}
  if(box)box.innerHTML='<div class="empty">Progress: '+(i+1)+' / '+parties.length+'</div>';
  save();
 }
 render();
 const out=document.getElementById("gstin_bulk_result");if(out)out.innerHTML=`<div class="pan" style="margin:10px 0"><b>${partyId?"Single Party GSTIN Result":"Bulk GSTIN Result"}</b><p>Checked: ${parties.length} &nbsp; Valid: ${ok} &nbsp; Failed: ${fail} &nbsp; Missing details updated: ${updated}</p>${tbl(["GSTIN","Result","Details"],rows)}</div>`;
}

 const k=cur,m=M[k],rec=RS.vf.rec,isR=k==="receipt",C=comp()||{};
 $("ttl").textContent=m.title;$("extra").innerHTML="";$("list").className="";
 const pre=rec.number&&/^\D+/.test(String(rec.number))?String(rec.number).match(/^\D+/)[0]:(isR?"REC-":"PAY-");
 const no=rec.number?vNum(rec.number):vNext(k);
 const acc=rec.account||(rec.mode&&rec.mode!=="Cash"?"Bank Account":"Cash Account");
 const accs=["Cash Account","Bank Account"];if(acc&&!accs.includes(acc))accs.push(acc);
 const lab=(t,r)=>`<label>${t}${r?" *":""}</label>`;
 $("list").innerHTML=`<div class="voucher-head"><div class="vicon">▣</div><div><div style="font-size:16px;font-weight:600">${m.title}</div><div style="font-size:11px;color:#6b7690">${esc(C.name||"")}${C.name?" • ":""}${isR?"Cash/Bank transaction entry":"Cash/Bank payment entry"}</div></div></div>
 <div class="voucher-card"><div class="voucher-title">${isR?"Receipt":"Payment"} Details</div><div class="voucher-grid">
 <div>${lab("Voucher No.")}<div class="vno"><span id="f_pre">${esc(pre)}</span><input id="f_vno" value="${esc(no)}"></div></div>
 <div>${lab("Date")}<input id="f_date" type="date" value="${esc(rec.date||today())}"></div>
 <div>${lab(isR?"Received From Party":"Paid To Party",1)}<select id="f_party" onchange="blLoad()"><option value="">Select party</option>${DB.party.map(o=>`<option value="${o.id}" ${o.id===rec.party?"selected":""}>${esc(o.name)}</option>`).join("")}</select></div>
 <div>${lab(isR?"Received In":"Paid From")}<select id="f_account">${accs.map(a=>`<option ${a===acc?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
 <div>${lab(isR?"Received Amount (₹)":"Payment Amount (₹)",1)}<input id="f_amount" class="vamt" type="number" step="any" placeholder="0.00" value="${esc(rec.amount??"")}" onchange="blAuto()"></div>
 <div>${lab("TDS Deducted (₹)")}<input id="f_tds" class="vamt" type="number" step="any" placeholder="0.00" value="${esc(rec.tds||"")}" onchange="blSync()"></div>
 <div class="wide">${lab("Narration / Remarks")}<textarea id="f_remark" rows="3" placeholder="${isR?"Receipt":"Payment"} details...">${esc(rec.remark||"")}</textarea></div></div>
 <div id="bills" style="padding:0 18px 8px"></div>
 <div class="voucher-actions"><button type="button" style="background:#fff;color:#111a33;border:1px solid #111a33" onclick="voucherClear()">Clear</button><button type="button" style="background:#fff;color:#111a33;border:1px solid #111a33" onclick="voucherPrint()">🖶 Print / Export</button><button type="button" style="background:#16905a" onclick="voucherSave()">▣ Save ${isR?"Receipt":"Payment"} (F2)</button></div></div>`;
 blLoad(RS.vf.id?rec:null);
 setTimeout(()=>{const e=$(RS.vf&&RS.vf.id?"f_amount":"f_party");if(e&&e.focus)e.focus()},50);
}
function voucherClear(){
 if(cur==="journal"){jClear();return}
 const k=cur,set=(id,v)=>{const e=$(id);if(e)e.value=v};
 set("f_vno",vNext(k));set("f_date",today());set("f_party","");set("f_account","Cash Account");set("f_amount","");set("f_tds","");set("f_remark","");
 RS.bl={sel:{},list:[]};blDraw();
}
function voucherData(){
 const v=id=>($(id)||{}).value||"",k=cur;
 return {pre:($("f_pre")||{}).textContent||(k==="receipt"?"REC-":"PAY-"),no:v("f_vno").trim(),date:v("f_date"),party:v("f_party"),account:v("f_account"),amount:+v("f_amount")||0,tds:+v("f_tds")||0,remark:v("f_remark").trim()};
}
function voucherPrint(){
 if(cur==="journal"){jPrint();return}
 const d=voucherData(),k=cur,C=comp()||{},title=k==="receipt"?"Receipt Voucher":"Payment Voucher",S=RS.bl.sel,al=RS.bl.list.filter(b=>S[b.id]>0);
 const rows=[["Voucher No.",d.pre+(d.no||vNext(k))],["Date",fd(d.date)],[k==="receipt"?"Received From":"Paid To",lookup("party",d.party)],[k==="receipt"?"Received In":"Paid From",d.account],["Amount","₹ "+inr2(d.amount)],["TDS Deducted","₹ "+inr2(d.tds)],["Total (Amount + TDS)","₹ "+inr2(d.amount+d.tds)],["Amount in words",inrWords(d.amount)],["Bills settled",al.map(b=>b.inv+" (₹ "+inr2(S[b.id])+")").join(", ")],["Narration",d.remark]];
 prOpen(title+" "+d.pre+d.no,`<div style="padding:18px"><div style="text-align:center;font-size:18px;font-weight:bold">${esc(C.name||"")}</div><div style="text-align:center;font-size:11px;margin-bottom:12px">${esc(prCompany().addr)}${C.gstin?" • GSTIN: "+esc(C.gstin):""}</div><h2 style="text-align:center;margin:6px 0 14px;text-decoration:underline">${title}</h2><table style="width:100%;border-collapse:collapse">${rows.map(r=>`<tr><td style="padding:9px;border:1px solid #999;width:30%;font-weight:bold">${r[0]}</td><td style="padding:9px;border:1px solid #999">${esc(r[1]||"")}</td></tr>`).join("")}</table><div style="display:flex;justify-content:space-between;margin-top:60px"><div>Receiver's Signature</div><div style="font-weight:bold">${esc(prCompany().label)}</div></div></div>`);
}
function voucherSave(){
 if(cur==="journal"){jSave();return}
 const d=voucherData(),k=cur,id=RS.vf&&RS.vf.id,old=id?DB[k].find(x=>x.id===id):null;
 if(!d.date){alert("Date is required");return}
 if(!d.party){alert((k==="receipt"?"Received From Party":"Paid To Party")+" is required");return}
 if(!(d.amount>0)){alert((k==="receipt"?"Received":"Payment")+" Amount is required");return}
 const S=RS.bl.sel,al=RS.bl.list.filter(b=>S[b.id]>0).map(b=>({id:b.id,inv:b.inv,amount:r2(S[b.id])})),t=al.reduce((a,x)=>a+x.amount,0);
 if(t>d.amount+d.tds+0.005){alert("Selected bills total (₹ "+n2(t)+") is more than Amount + TDS (₹ "+n2(d.amount+d.tds)+")");return}
 const oldPre=old?(String(old.number||"").match(/^\D*/)[0]||(k==="receipt"?"REC-":"PAY-")):"",keepNo=!!old&&d.pre===oldPre&&d.no===vNum(old.number);
 const number=keepNo?old.number:d.pre+(d.no||vNext(k));
 if(!keepNo&&DB[k].some(x=>x.id!==id&&String(x.number||"")===number)){alert("Voucher No. "+number+" already exists");return}
 const mode=old&&old.account===d.account&&old.mode?old.mode:(/^cash/i.test(d.account)?"Cash":"Bank");
 const rec={number,date:d.date,party:d.party,account:d.account,mode,amount:d.amount,tds:d.tds,remark:d.remark,alloc:al};
 if(old){const i=DB[k].findIndex(x=>x.id===id);DB[k][i]={...old,...rec}}else DB[k].push({id:uid(),...rec});
 save();RS.vf=null;render();
}

/* ===== Journal Voucher (multi-line, full page) ===== */
const jBlank=()=>({acc:"",dr:"",cr:""});
function renderJournal(){
 const m=M.journal,rec=RS.vf.rec,C=comp()||{};
 $("ttl").textContent=m.title;$("extra").innerHTML="";$("list").className="";
 if(!RS.vf.lines)RS.vf.lines=RS.vf.id?jLines(rec).map(l=>({acc:l.acc||"",dr:l.dr||"",cr:l.cr||""})):[jBlank(),jBlank()];
 const no=rec.number?vNum(rec.number):jNext();
 const lab=t=>`<label>${t}</label>`;
 $("list").innerHTML=`<div class="voucher-head"><div class="vicon">⚖️</div><div><div style="font-size:16px;font-weight:600">${m.title}</div><div style="font-size:11px;color:#6b7690">${esc(C.name||"")}${C.name?" • ":""}Journal entry (multi-line Debit / Credit)</div></div></div>
 <div class="voucher-card" style="margin-bottom:14px"><div class="voucher-grid">
  <div>${lab("Series")}<input class="jser" id="f_pre" value="JV" readonly></div>
  <div>${lab("Voucher No.")}<input id="f_vno" value="${esc(no)}"></div>
  <div>${lab("Date")}<input id="f_date" type="date" value="${esc(rec.date||today())}"></div>
  <div>${lab("Difference")}<div class="jdiff" id="jdiff">₹0.00</div></div>
 </div></div>
 <div class="voucher-card" style="margin-bottom:14px"><div class="jhead"><b>Journal Particulars</b><button type="button" class="jlink" onclick="jAdd()">+ Add Ledger</button></div>
  <div class="jwrap"><table class="jtbl"><thead><tr><th style="width:44px">#</th><th>Account / Party</th><th style="width:210px">Debit (₹)</th><th style="width:210px">Credit (₹)</th><th style="width:50px"></th></tr></thead><tbody id="jrows"></tbody>
  <tfoot><tr><td></td><td>Total</td><td id="jtd">₹0.00</td><td id="jtc">₹0.00</td><td></td></tr></tfoot></table></div>
  <div style="padding:14px 18px"><button type="button" class="jlink" onclick="jAdd()">+ Add another line</button></div></div>
 <div class="voucher-card"><div class="voucher-grid"><div class="wide">${lab("Narration / Remarks")}<textarea id="f_remark" rows="3" placeholder="Enter journal entry narration...">${esc(rec.remark||"")}</textarea></div></div>
  <div class="voucher-actions"><button type="button" style="background:#fff;color:#111a33;border:1px solid #111a33" onclick="jClear()">Clear</button><button type="button" style="background:#fff;color:#111a33;border:1px solid #111a33" onclick="jPrint()">🖶 Print / Export</button><button type="button" style="background:#3151d3" onclick="jSave()">▣ Save Journal (F2)</button></div></div>`;
 jDraw();jTot();
}
function jAccOpts(sel){return '<option value="">Select account or party</option>'+DB.party.map(o=>`<option value="${o.id}" ${o.id===sel?"selected":""}>${esc(o.name)}</option>`).join("")}
function jDraw(){
 const el=$("jrows");if(!el)return;
 el.innerHTML=RS.vf.lines.map((l,i)=>`<tr><td>${i+1}</td><td><select onchange="jSet(${i},'acc',this.value)">${jAccOpts(l.acc)}</select></td><td><input id="jd_${i}" type="number" step="any" min="0" placeholder="0.00" value="${esc(l.dr)}" oninput="jSet(${i},'dr',this.value)" onfocus="jFill(${i},'dr')"></td><td><input id="jc_${i}" type="number" step="any" min="0" placeholder="0.00" value="${esc(l.cr)}" oninput="jSet(${i},'cr',this.value)" onfocus="jFill(${i},'cr')"></td><td><button type="button" class="jx" title="Remove line" onclick="jDel(${i})">✕</button></td></tr>`).join("");
}
function jSet(i,f,v){
 const L=RS.vf.lines[i];if(!L)return;L[f]=v;
 if(f==="dr"&&+v>0){L.cr="";const e=$("jc_"+i);if(e)e.value=""}
 if(f==="cr"&&+v>0){L.dr="";const e=$("jd_"+i);if(e)e.value=""}
 jTot();
}
function jFill(i,f){
 const L=RS.vf.lines[i];if(!L||+L.dr||+L.cr)return;
 let td=0,tc=0;RS.vf.lines.forEach((x,j)=>{if(j!==i){td+=+x.dr||0;tc+=+x.cr||0}});
 const need=f==="cr"?td-tc:tc-td;
 if(need>0.004){L[f]=String(r2(need));const e=$((f==="dr"?"jd_":"jc_")+i);if(e){e.value=L[f];e.select()}jTot()}
}
function jTot(){
 let td=0,tc=0;RS.vf.lines.forEach(l=>{td+=+l.dr||0;tc+=+l.cr||0});
 td=r2(td);tc=r2(tc);const diff=r2(td-tc),bad=diff!==0||td===0;
 $("jtd").textContent="₹"+inr2(td);$("jtc").textContent="₹"+inr2(tc);
 const d=$("jdiff");d.textContent="₹"+inr2(Math.abs(diff))+(diff>0?" (Dr excess)":diff<0?" (Cr excess)":"");
 d.style.color=bad?"#d6264f":"#16905a";d.style.background=bad?"#fdf0f3":"#eefaf3";
}
function jAdd(){RS.vf.lines.push(jBlank());jDraw();jTot();const e=$("jrows").lastElementChild;if(e){const s=e.querySelector("select");if(s)s.focus()}}
function jDel(i){
 if(RS.vf.lines.length<=2)RS.vf.lines[i]=jBlank();else RS.vf.lines.splice(i,1);
 jDraw();jTot();
}
function jClear(){
 RS.vf.lines=[jBlank(),jBlank()];
 const set=(id,v)=>{const e=$(id);if(e)e.value=v};
 set("f_vno",RS.vf.id&&RS.vf.rec.number?vNum(RS.vf.rec.number):jNext());set("f_date",today());set("f_remark","");
 jDraw();jTot();
}
function jData(){
 const v=id=>($(id)||{}).value||"";
 const all=RS.vf.lines.map((l,i)=>({n:i+1,acc:l.acc,dr:r2(l.dr),cr:r2(l.cr)}));
 return {no:v("f_vno").trim(),date:v("f_date"),remark:v("f_remark").trim(),all,lines:all.filter(l=>l.acc||l.dr>0||l.cr>0)};
}
function jPrint(){
 const d=jData(),C=comp()||{},td=r2(d.lines.reduce((a,l)=>a+l.dr,0)),tc=r2(d.lines.reduce((a,l)=>a+l.cr,0));
 const cell='padding:8px;border:1px solid #999';
 const rows=d.lines.map((l,i)=>`<tr><td style="${cell};text-align:center">${i+1}</td><td style="${cell}">${esc(lookup("party",l.acc))}</td><td style="${cell};text-align:right">${l.dr?inr2(l.dr):""}</td><td style="${cell};text-align:right">${l.cr?inr2(l.cr):""}</td></tr>`).join("");
 prOpen("Journal Voucher JV-"+(d.no||jNext()),`<div style="padding:18px"><div style="text-align:center;font-size:18px;font-weight:bold">${esc(C.name||"")}</div><div style="text-align:center;font-size:11px;margin-bottom:12px">${esc(prCompany().addr)}${C.gstin?" • GSTIN: "+esc(C.gstin):""}</div><h2 style="text-align:center;margin:6px 0 14px;text-decoration:underline">Journal Voucher</h2>
 <div style="display:flex;justify-content:space-between;margin-bottom:10px"><div><b>Voucher No.:</b> JV-${esc(d.no||jNext())}</div><div><b>Date:</b> ${esc(fd(d.date))}</div></div>
 <table style="width:100%;border-collapse:collapse"><tr><th style="${cell};width:40px">#</th><th style="${cell}">Account / Party</th><th style="${cell};width:130px">Debit (₹)</th><th style="${cell};width:130px">Credit (₹)</th></tr>${rows}<tr><td style="${cell}"></td><td style="${cell};font-weight:bold">Total</td><td style="${cell};text-align:right;font-weight:bold">${inr2(td)}</td><td style="${cell};text-align:right;font-weight:bold">${inr2(tc)}</td></tr></table>
 <div style="margin-top:12px"><b>Amount in words:</b> ${esc(inrWords(td))}</div><div style="margin-top:6px"><b>Narration:</b> ${esc(d.remark)}</div>
 <div style="display:flex;justify-content:space-between;margin-top:60px"><div>Prepared By</div><div style="font-weight:bold">${esc(prCompany().label)}</div></div></div>`);
}
function jSave(){
 const d=jData(),id=RS.vf&&RS.vf.id,old=id?DB.journal.find(x=>x.id===id):null;
 if(!d.date){alert("Date is required");return}
 if(d.lines.length<2){alert("Enter at least two ledger lines");return}
 for(const l of d.lines){
  if(!l.acc){alert("Select an Account / Party on line "+l.n);return}
  if(!(l.dr>0||l.cr>0)){alert("Enter a Debit or Credit amount on line "+l.n);return}
  if(l.dr>0&&l.cr>0){alert("Line "+l.n+" cannot have both Debit and Credit");return}
 }
 const td=r2(d.lines.reduce((a,l)=>a+l.dr,0)),tc=r2(d.lines.reduce((a,l)=>a+l.cr,0));
 if(!(td>0)){alert("Total amount is required");return}
 if(td!==tc){alert("Total Debit (₹ "+inr2(td)+") and Total Credit (₹ "+inr2(tc)+") must be equal. Difference: ₹ "+inr2(Math.abs(td-tc)));return}
 const keepNo=!!old&&d.no===vNum(old.number),number=keepNo?old.number:"JV-"+(d.no||jNext());
 if(!keepNo&&DB.journal.some(x=>x.id!==id&&String(x.number||"")===number)){alert("Voucher No. "+number+" already exists");return}
 const rec={series:"JV",number,date:d.date,lines:d.lines.map(l=>({acc:l.acc,dr:l.dr,cr:l.cr})),amount:td,remark:d.remark};
 if(old){const i=DB.journal.findIndex(x=>x.id===id);DB.journal[i]={id:old.id,...rec}}else DB.journal.push({id:uid(),...rec});
 save();RS.vf=null;render();
}

/* ===== Login screen ===== */
function showLogin(){
 let d=$("authbox");if(!d){d=document.createElement("div");d.id="authbox";document.body.appendChild(d)}
 d.className="authov";d.style.display="flex";
 d.innerHTML=`<div class="authbox"><div style="font-size:34px">📒</div><h2>Accounts Login</h2><p>Sign in to continue</p><label>Username</label><input id="lg_u" autocomplete="username"><label>Password</label><input id="lg_p" type="password" autocomplete="current-password"><div class="aerr" id="lg_err"></div><button type="button" onclick="doLogin()">Login</button></div>`;
 d.querySelectorAll("input").forEach(e=>e.onkeydown=ev=>{if(ev.key==="Enter")doLogin()});
 setTimeout(()=>{const e=$("lg_u");if(e)e.focus()},50);
}
function hideLogin(){const d=$("authbox");if(d)d.style.display="none"}
function doLogin(){
 const n=($("lg_u").value||"").trim().toLowerCase(),pw=$("lg_p").value||"";
 const u=DB.users.find(x=>x.name.toLowerCase()===n&&x.ph===pwHash(pw));
 if(!u){$("lg_err").textContent="Invalid username or password";return}
 AUTH.uid=u.id;try{sessionStorage.setItem("acc_sess",u.id)}catch(e){}
 cur="dashboard";RS.sf=null;RS.vf=null;RS.back=null;RS.uf=null;render();
}
function doLogout(){
 AUTH.uid="";try{sessionStorage.removeItem("acc_sess")}catch(e){}
 cur="dashboard";RS.sf=null;RS.vf=null;RS.back=null;RS.uf=null;render();
}

function renderUsers(){

 }
 const rows=DB.users.map(u=>[esc(u.name)+(u.id===AUTH.uid?" <small style='color:#6b7690'>(you)</small>":""),u.role==="admin"?"Admin":"User",u.role==="admin"?"All companies":(esc(DB.company.filter(c=>(u.companies||[]).includes(c.id)).map(c=>c.name).join(", "))||"<span style='color:#d6264f'>No company assigned</span>"),`<button class="e" onclick="uForm('${u.id}')">Edit</button> ${u.id===AUTH.uid?"":`<button class="d" onclick="uDel('${u.id}')">Delete</button>`}`]);

function uRole(){const r=$("u_role"),w=$("u_cowrap");if(r&&w)w.style.display=r.value==="admin"?"none":""}
function uForm(id){RS.uf={id:id||null};render();setTimeout(()=>{const e=$("u_name");if(e)e.focus()},50)}
function uCancel(){RS.uf=null;render()}
function uEnable(){
 const n=($("u_name").value||"").trim(),a=$("u_pw").value||"",b=$("u_pw2").value||"";
 if(!n){alert("Username is required");return}
 if(a.length<4){alert("Password must be at least 4 characters");return}
 if(a!==b){alert("Passwords do not match");return}
 const u={id:uid(),name:n,ph:pwHash(a),role:"admin",companies:[]};
 DB.users=[u];AUTH.uid=u.id;try{sessionStorage.setItem("acc_sess",u.id)}catch(e){}
 save();render();
}
function uSave(){
 const f=RS.uf;if(!f)return;
 const n=($("u_name").value||"").trim(),pw=$("u_pw").value||"",role=$("u_role").value;
 const cos=[...document.querySelectorAll(".ucb")].filter(e=>e.checked).map(e=>e.value);
 const old=f.id?DB.users.find(x=>x.id===f.id):null;
 if(!n){alert("Username is required");return}
 if(DB.users.some(x=>x.id!==f.id&&x.name.toLowerCase()===n.toLowerCase())){alert("Username already exists");return}
 if(!old&&pw.length<4){alert("Password must be at least 4 characters");return}
 if(pw&&pw.length<4){alert("Password must be at least 4 characters");return}
 if(role==="user"&&!cos.length){alert("Select at least one company for this user");return}
 if(old&&old.role==="admin"&&role!=="admin"&&DB.users.filter(x=>x.role==="admin").length<2){alert("At least one Admin is required");return}
 if(old){old.name=n;old.role=role;old.companies=role==="admin"?[]:cos;if(pw)old.ph=pwHash(pw)}
 else DB.users.push({id:uid(),name:n,ph:pwHash(pw),role,companies:role==="admin"?[]:cos});
 save();RS.uf=null;
 if(old&&old.id===AUTH.uid&&role!=="admin"){cur="dashboard"}
 render();
}
function uDel(id){
 const u=DB.users.find(x=>x.id===id);if(!u||id===AUTH.uid)return;
 if(u.role==="admin"&&DB.users.filter(x=>x.role==="admin").length<2){alert("At least one Admin is required");return}
 if(!confirm("Delete user "+u.name+"?"))return;
 DB.users=DB.users.filter(x=>x.id!==id);save();render();
}

function saveForm(){
 const m=M[cur],rec={};
 for(const f of m.f){
  const el=$("f_"+f.k); if(!el)continue;
  const v=el.value.trim();
  if(f.r&&!v){alert(f.l+" is required");return}
  rec[f.k]=v;
 }
 if(cur==="receipt"||cur==="payment"){
  rec.mode=rec.account==="Cash Account"?"Cash":"Bank";
  rec.tds=+rec.tds||0;
  rec.number=rec.number||((cur==="receipt"?"REC-":"PAY-")+String(DB[cur].length+1).padStart(3,"0"));
  rec.remark=rec.remark||"";
 
  const S=RS.bl.sel,al=RS.bl.list.filter(b=>S[b.id]>0).map(b=>({id:b.id,inv:b.inv,amount:r2(S[b.id])})),t=al.reduce((a,x)=>a+x.amount,0);
  if(t>(+rec.amount||0)+0.005){alert("Selected bills total (₹ "+n2(t)+") is more than the Amount");return}
  rec.alloc=al;
 }
 if(cur==="company"){rec.city=stName(rec.stcode)||rec.city||"";if(!rec.printname)rec.printname=rec.name;if(!rec.shortname)rec.shortname=rec.name}
 if(cur==="journal"&&rec.dr===rec.cr){alert("Debit and Credit accounts must be different");return}
 if(m.tx)rec.amount=((+rec.qty||0)*(+rec.rate||0)).toFixed(2);
 if(editId){const i=DB[cur].findIndex(x=>x.id===editId);DB[cur][i]={...DB[cur][i],...rec}}
 else{const nid=uid();DB[cur].push({id:nid,...rec});if(RS.ret){if(cur==="party")RS.newParty=nid;if(cur==="item")RS.newItem=nid}}
 save();$("dlg").close();render();
}

function del(id){
 if(cur==="company"){coDel(id);return}
 if(cur==="sale"&&DB.sale.some(x=>x.id===id&&x.irn)){alert("इस Invoice का E-Invoice (IRN) बन चुका है। इसे Delete नहीं किया जा सकता।");return}
 if(!confirm("Are you sure you want to delete this record?"))return;
 if(cur==="party"||cur==="item"){
  const used=Object.keys(M).some(k=>k!==cur&&DB[k].some(r=>r.party===id||r.item===id||r.dr===id||r.cr===id||(r.lines||[]).some(l=>l.acc===id)||(r.items||[]).some(l=>l.item===id)));
  if(used&&!confirm("This record is used in other entries. Delete it anyway?"))return;
 }
 DB[cur]=DB[cur].filter(x=>x.id!==id);
 save();render();
}

$("add").onclick=()=>{if(cur==="users"){uForm();return}if(VK[cur]&&RS.vf){RS.vf=null;render();return}if(KC[cur]&&RS.sf){RS.sf=null;if(RS.back){cur=RS.back;RS.back=null}render();return}if(cur==="dashboard"){cur="company";render()}openForm()};
document.addEventListener("keydown",e=>{if(e.key==="F2"&&KC[cur]&&RS.sf){e.preventDefault();saleSave()}if(e.key==="F2"&&VK[cur]&&RS.vf){e.preventDefault();voucherSave()}});
$("sv").onclick=saveForm;
$("cx").onclick=()=>$("dlg").close();
$("dlg").addEventListener("close",()=>{if(RS.ret){const k=RS.ret,np=RS.newParty,ni=RS.newItem;RS.ret=null;RS.newParty=null;RS.newItem=null;cur=k;render();if(np&&RS.sf)sfParty(np);if(ni&&RS.sf)sfItemNew(ni)}});
$("q").oninput=render;
render();
gstReminderCheck(false);
bkInit();
cloudInit();
</script>

<script>
(function(){
 const nav=document.getElementById('nav');
 const btn=document.getElementById('mobileMenuBtn');
 const shade=document.getElementById('mobileNavShade');
 if(!nav||!btn||!shade)return;
 function closeMenu(){nav.classList.remove('mobile-open');shade.classList.remove('show');btn.setAttribute('aria-expanded','false')}
 function openMenu(){nav.classList.add('mobile-open');shade.classList.add('show');btn.setAttribute('aria-expanded','true')}
 btn.addEventListener('click',()=>nav.classList.contains('mobile-open')?closeMenu():openMenu());
 shade.addEventListener('click',closeMenu);
 nav.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
 window.addEventListener('resize',()=>{if(window.innerWidth>820)closeMenu()});
})();
</script>
